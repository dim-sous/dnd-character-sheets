<!doctype html>
<!--
  Regression check for the Hit Points tile: the result line (#74) and what a long rest does to
  HP (#106).

  The arithmetic is covered by tests.js (`describeHpChange`, `restoreHp`). What only a browser
  can prove is the wiring and the reachability: that a real keystroke reaches the sentence, that
  the visible line and the #play-status live region get the SAME one, that a real minus sign —
  which this field's own tooltip used to tell players to type — is no longer swallowed, and that
  the ordinary "never opened Edit, so Max is still 0" path no longer loses all your hit points
  to a rest.

  Run it the same way as probe.html; prints ALL PASS or the failing checks. The last two blocks
  reload the iframe to reseed, so they run LAST and bind their own document — anything appended
  after them must do the same rather than reusing `d`/`w`.
-->
<meta charset="utf-8">
<title>hp result probe</title>
<style>
  body { font: 13px/1.6 ui-monospace, monospace; margin: 0; }
  #frame { width: 390px; height: 844px; border: 0; position: absolute; left: -9999px; }
  #out { white-space: pre-wrap; padding: 8px; }
</style>
<pre id="out">pending</pre>
<iframe id="frame" src="about:blank"></iframe>
<script type="module">
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const results = [];
const ok = (name, cond, detail = '') => results.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? `   ${detail}` : ''}`);

try {
  if (navigator.serviceWorker) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map((r) => r.unregister()));
  }
  if (window.caches) {
    const keys = await caches.keys();
    await Promise.all(keys.map((k) => caches.delete(k)));
  }

  const { STORAGE_KEY, SCHEMA_VERSION, blankCharacter } = await import('../js/constants.js');
  const a = blankCharacter();
  a.name = 'Alpha'; a.class = 'Wizard'; a.level = 5;
  a.hp.max = 20; a.hp.current = 12; a.hp.temp = 5;
  const b = blankCharacter();
  b.name = 'Beta'; b.hp.max = 40; b.hp.current = 40; b.hp.temp = 0;
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    version: SCHEMA_VERSION, schemaVersion: SCHEMA_VERSION, activeId: a.id, characters: [a, b],
  }));
  localStorage.removeItem('dnd-character-sheets:layout');

  const frame = document.getElementById('frame');
  await new Promise((res) => { frame.onload = res; frame.src = '../index.html'; });
  await wait(1200);
  const d = frame.contentDocument;
  const w = frame.contentWindow;

  const cur = () => d.getElementById('f-hp-current');
  const temp = () => d.getElementById('f-hp-temp');
  const line = () => d.getElementById('hp-result');
  const spoken = () => d.getElementById('play-status').textContent.trim();
  // Read the committed value off the FIELD, not localStorage: the store is debounced 400ms
  // (state.js), so reading it straight after a commit returns the previous value and every
  // assertion built on it fails for a reason that has nothing to do with the code under test.
  const curVal = () => Number(cur().value);
  const tempVal = () => Number(temp().value);

  /*
   * Type like a person: execCommand('insertText') sets the input's dirty flag, which a plain
   * `.value =` assignment does not — without it `change` never fires and the whole path is
   * untested while appearing to pass.
   */
  const type = async (text) => {
    const el = cur();
    el.focus();
    d.execCommand('selectAll');
    d.execCommand('insertText', false, text);
    el.dispatchEvent(new w.Event('change', { bubbles: true }));
    await wait(250);
  };

  ok('starts with no result line', line().hidden && line().textContent === '',
    `hidden=${line().hidden} text="${line().textContent}"`);
  ok('seeded at 12 of 20 with temp 5', curVal() === 12 && tempVal() === 5,
    `current ${curVal()} temp ${tempVal()}`);

  /*
   * The ABSOLUTE contract goes first, while temp is still up — that is the whole divergence
   * #74 is about, and testing it after a delta has already drained temp proves nothing.
   */
  await type('19');
  ok('an absolute set is described as a set', /Set to 19/.test(line().textContent),
    `"${line().textContent}"`);
  ok('and it discloses that temp was left alone', /Temp 5 unchanged/.test(line().textContent),
    `"${line().textContent}"`);
  ok('the set really ignored temp', curVal() === 19 && tempVal() === 5,
    `current ${curVal()} temp ${tempVal()}`);

  // Same field, same intent, different contract — and now it says so.
  await type('-8');
  ok('a delta is described as a delta', /Took 8/.test(line().textContent), `"${line().textContent}"`);
  ok('the delta names the temp absorption', /Temp absorbed 5/.test(line().textContent));
  ok('the line is visible', !line().hidden);
  ok('screen and screen-reader get the SAME sentence', spoken() === line().textContent.trim(),
    `spoken="${spoken()}" visible="${line().textContent.trim()}"`);
  ok('the delta really went through temp first', curVal() === 16 && tempVal() === 0,
    `current ${curVal()} temp ${tempVal()}`);

  // --- the bug that started this: the app told players to type a character it rejected ----
  const before = curVal();
  await type('−8');   // U+2212, the glyph formatMod prints and the tooltip used to show
  ok('a real minus sign (U+2212) is no longer swallowed', curVal() !== before,
    `current ${before} -> ${curVal()}`);
  ok('and it damages rather than setting', curVal() === before - 8, `current ${curVal()}`);
  ok('the tooltip no longer tells you to type U+2212',
    !cur().title.includes('−'), JSON.stringify(cur().title));

  /*
   * The phantom second commit. `commitHpCurrent` repaints the field to the absolute result, so
   * blurring after Enter fires a `change` carrying THAT number as a bare entry. Caught by a
   * screenshot: the tile read "No change. Now 9 of 20." a moment after a -8 that plainly did
   * something. Blur here the way a finger does, and hold the sentence to account.
   */
  await type('-4');
  const afterDelta = line().textContent;
  ok('a delta leaves its sentence up', /Took 4/.test(afterDelta), `"${afterDelta}"`);
  cur().blur();
  cur().dispatchEvent(new w.Event('change', { bubbles: true }));
  await wait(300);
  ok('blurring does not overwrite it with “No change”', line().textContent === afterDelta,
    `"${afterDelta}" -> "${line().textContent}"`);
  ok('and does not clear it either', !line().hidden);

  // --- an unreadable entry says so, rather than nothing -----------------------------------
  await type('abc');
  ok('unreadable input is reported', /Couldn’t read/.test(line().textContent), `"${line().textContent}"`);
  ok('and it is spoken too', /Couldn’t read/.test(spoken()));

  // --- clearing --------------------------------------------------------------------------
  await type('');
  ok('a blank entry clears the line rather than captioning nothing', line().hidden,
    `hidden=${line().hidden} text="${line().textContent}"`);

  // --- a long rest must not leave a stale caption -----------------------------------------
  await type('-5');
  ok('line is up again before the rest', !line().hidden);
  w.confirm = () => true;
  d.querySelector('[data-action="long-rest"]').click();
  await wait(350);
  ok('a long rest clears the HP line', line().hidden, `text="${line().textContent}"`);
  ok('the rest is still announced', /Long rest taken/.test(spoken()), `"${spoken()}"`);

  // --- switching character must not carry the caption across -------------------------------
  await type('-3');
  ok('line is up again before the switch', !line().hidden);
  const betaBtn = [...d.querySelectorAll('.roster__btn')].find((n) => /Beta/.test(n.textContent));
  ok('found the other character in the roster', Boolean(betaBtn));
  betaBtn.click();
  await wait(400);
  ok('opening another character clears the line', line().hidden,
    `text="${line().textContent}"`);

  // --- it must not reappear on unrelated edits (it is handler-owned, not render-owned) -----
  await wait(100);
  const ac = d.getElementById('f-ac');
  if (ac) {
    ac.focus();
    d.execCommand('selectAll');
    d.execCommand('insertText', false, '15');
    ac.dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(250);
  }
  ok('an unrelated edit does not resurrect the line', line().hidden, `text="${line().textContent}"`);

  /*
   * #106, end to end. The pure rule is covered in tests.js; what only the browser shows is that
   * the ordinary path reaches it — Max HP is Edit-gated (no `data-live`), so a player who never
   * opens Edit is tracking Current against a max of 0, and a rest used to assign that 0 over it.
   * Silently, because the `.is-dying` cue requires max > 0.
   */
  /*
   * Reseed and reload. Blank the frame FIRST and wait: the outgoing document flushes its
   * debounced save on unload, which lands AFTER a straight `setItem` + navigate and quietly
   * restores the previous character over the seed. That produced two failures whose message
   * ("current 17 max 20") described a character this block never asked for.
   */
  const reseed = async (mutate) => {
    await new Promise((res) => { frame.onload = res; frame.src = 'about:blank'; });
    await wait(500);
    const c = blankCharacter();
    mutate(c);
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: SCHEMA_VERSION, schemaVersion: SCHEMA_VERSION, activeId: c.id, characters: [c],
    }));
    await new Promise((res) => { frame.onload = res; frame.src = '../index.html'; });
    await wait(1000);
  };

  await reseed((c) => { c.name = 'Gamma'; c.hp.max = 0; c.hp.current = 14; c.hp.temp = 3; });
  const d2 = frame.contentDocument;
  const w2 = frame.contentWindow;
  const cur2 = () => Number(d2.getElementById('f-hp-current').value);
  const temp2 = () => Number(d2.getElementById('f-hp-temp').value);
  ok('seeded with Max never set', cur2() === 14 && Number(d2.getElementById('f-hp-max').value) === 0,
    `current ${cur2()} max ${d2.getElementById('f-hp-max').value}`);
  ok('Max really is Edit-gated', d2.getElementById('f-hp-max').readOnly);
  w2.confirm = () => true;
  d2.querySelector('[data-action="long-rest"]').click();
  await wait(400);
  ok('a rest with Max unset does NOT zero current HP', cur2() === 14, `current ${cur2()}`);
  ok('and still clears temp', temp2() === 0, `temp ${temp2()}`);
  ok('and does not render as dying', !d2.body.classList.contains('is-dying'));

  // A hand-set current above max must survive too — a rest is a heal, and heals never subtract.
  await reseed((c) => { c.name = 'Delta'; c.hp.max = 20; c.hp.current = 30; c.hp.temp = 0; });
  const d3 = frame.contentDocument;
  // Capture what the dialog actually says, rather than asserting against the button's label —
  // the promise the player agrees to has to match what the rest now does.
  let confirmText = '';
  frame.contentWindow.confirm = (msg) => { confirmText = String(msg); return true; };
  d3.querySelector('[data-action="long-rest"]').click();
  await wait(400);
  ok('a rest does not lower a hand-set current above max',
    Number(d3.getElementById('f-hp-current').value) === 30,
    `current ${d3.getElementById('f-hp-current').value}`);
  ok('the confirm no longer promises "HP to max"', !/HP to max/.test(confirmText),
    JSON.stringify(confirmText));
  ok('it promises what actually happens', /Restores lost HP/.test(confirmText),
    JSON.stringify(confirmText));


  const failed = results.filter((r) => r.startsWith('FAIL')).length;
  out.textContent = `${failed === 0 ? 'ALL PASS' : `${failed} FAILURE(S)`} — ${results.length} checks\n\n${results.join('\n')}`;
} catch (err) {
  out.textContent = `ERROR ${err && err.stack || err}\n\n${results.join('\n')}`;
}
</script>
