<!doctype html>
<meta charset="utf-8">
<title>Touch-target probe</title>
<!--
  Measures the running app in a real browser instead of reading declared values out of the
  stylesheet. It exists because this repo keeps getting the same class of thing wrong:

    - a class rule declares a size and is silently outranked by the base `input`/`.icon-btn`
      rule, so the control is NOT the size the stylesheet says (#77, #87);
    - or nothing declares a size at all and the control quietly inherits a 22px base (#86);
    - or the control is the right size, painted, and unreachable, because something invisible
      is on top of it (#115).

  All three are invisible to `grep` and to reading the CSS. All three are obvious the moment you
  measure. Two issues have already carried claims that measurement disproved, so: measure,
  don't infer.

  Width is a query parameter: `probe.html` is the 390px phone, `probe.html?w=1440` the laptop,
  where the tab bar is gone and every panel is revealed at once. Run both — #115 landed on
  both, at different rows, and one width alone would have read as PASS at the other.

  This is a development tool. tools/ is in stamp-sw.py's SKIP_DIRS, so nothing here is ever
  precached or deployed — but it must stay in tools/ for that to hold. A probe page left at
  the repo root WOULD be picked up by the precache sweep and shipped to every player's phone.

  Run:  see CLAUDE.md → "Measuring the running app".
-->
<style>
  body { margin: 0; font: 13px/1.4 ui-monospace, monospace; }
  /* The iframe width IS the viewport under test — pinning it here sidesteps window sizing
     and host OS display scaling, which do not survive the trip through headless Chrome.
     The width itself is set from ?w= in script; this is only the fallback. */
  #fr { width: 390px; height: 900px; border: 0; }
</style>
<pre id="out">pending</pre>
<iframe id="fr"></iframe>
<script type="module">
const TAP = 44;                 // CLAUDE.md's minimum, and --tap in style.css
// 390 is the phone this app is designed at; ?w=1440 is the laptop layout, which reveals every
// panel at once (`.tabpanel[hidden]{display:contents}`) and so puts far more of the sheet on
// screen at the same time — that is where #115's covered controls spread widest.
const VIEWPORT = Number(new URLSearchParams(location.search).get('w')) || 390;
const out = document.getElementById('out');

try {
  /*
   * Clear the service worker FIRST. The app registers a cache-first worker, so a probe run in a
   * reused browser profile will happily measure the PREVIOUS build — stale CSS, stale modules,
   * and a "module does not provide export X" error for code you just wrote. Silently wrong
   * measurements are worse than none, and this harness exists to be trusted.
   */
  if (navigator.serviceWorker) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map((r) => r.unregister()));
  }
  if (window.caches) {
    const keys = await caches.keys();
    await Promise.all(keys.map((k) => caches.delete(k)));
  }

  const { STORAGE_KEY, SCHEMA_VERSION, blankCharacter } = await import('../js/constants.js');

  // Seed through the app's own canonical shape so the probe can never drift from the real
  // model. A spellcasting ability is required or the Spells card renders nothing to measure.
  const c = blankCharacter();
  // A full name, not "Probe": the Identity card sized every field the same and cropped four
  // of eight, and a five-letter name is the fixture that hides it — the same blind spot the
  // attack rows had. Same reasoning for the rest of the identity line.
  c.name = 'Thorin Blackhand'; c.class = 'Fighter'; c.level = 5;
  c.subclass = 'Battle Master'; c.species = 'Mountain Dwarf';
  // A real background from a real character, and the value that was still being cut off
  // ("Emerald Enclave Ca…") after the first attempt at this card.
  c.background = 'Emerald Enclave Captain'; c.alignment = 'Lawful Good'; c.player = 'Dimitris';
  c.hp.max = 30; c.hp.current = 20; c.hp.temp = 0;
  c.ac = 15; c.speed = 30;
  c.spellcasting.ability = 'int';
  c.spellcasting.slots[1] = { total: 4, used: 1 };
  /*
   * One short row and one deliberately LONG one. The short row is the common case; the long one
   * is the fixture that was missing when a 24-character name pushed the primary line to 386px
   * inside a 304px row and scrolled the whole document to 423 against a 375px viewport. With
   * only "Dagger" in here the probe reported PASS through all of it.
   *
   * Long free-text values are the general case worth seeding — every field in this app is
   * free-form and unvalidated, so "what a real player types" is the load, not the placeholder.
   */
  c.attacks = [
    { name: 'Dagger', ability: 'dex', proficient: true, damage: '1d4', notes: '' },
    { name: 'Longbow of the Deep Wood', ability: 'dex', proficient: true, damage: '1d8+2 piercing', notes: 'Range 150/600' },
  ];
  c.inventory = [{ name: 'Explorer’s pack with bedroll and rations', qty: 1, notes: '' }];
  /*
   * #145: features and feats, seeded for the reason every list above is seeded — an empty one
   * renders its empty-state line and nothing else, so the row is never measured and the card
   * reports PASS at every width and theme without the thing it exists to show having been looked
   * at once. These two lists had gone unseeded since #67 shipped them.
   *
   * Short row and long row again. A subclass feature name really does run this long, and it is
   * the fixture that decides whether a primary line carrying the ✕ and #147's reveal button
   * still fits at 390px. The detail values are long for the same reason one level down: source,
   * level and a description share a wrapping flex line, and the description is a textarea whose
   * height the audit only sees once something opens the block.
   */
  c.features = [
    { name: 'Second Wind', source: 'Fighter', level: '1', text: 'Regain 1d10+5 HP as a Bonus Action.' },
    {
      name: 'Improved Divine Smite (Oath of Devotion)', source: 'Paladin', level: '11',
      text: 'Every melee weapon hit deals an extra 1d8 radiant damage, and a Channel Divinity option comes with it.',
    },
  ];
  c.feats = [
    { name: 'Alert', source: 'Origin', text: '+PB to initiative.' },
    { name: 'Great Weapon Master', source: 'General', text: 'A heavy weapon crit or kill grants a bonus attack with the same weapon.' },
  ];
  /*
   * #140: the same short-row/long-row pairing, and for the same reason. An UNSEEDED Resources
   * tile renders only its empty-state line, so the row's three fields and its ✕ are never
   * measured — the tile passes at every width and theme while the thing it exists to show has
   * not been looked at once.
   *
   * The long row is the fixture that matters: the name field is the only one here that grows,
   * so it is the one that can push a 390px row sideways, and real class resources have long
   * names ("Channel Divinity: Turn Undead" is 29 characters). Two-digit counts on it as well —
   * a level-20 monk has 20 Ki points, and a 3.6rem field sized around "3" is a different
   * measurement from one holding "14".
   */
  c.resources = [
    { name: 'Rage', remaining: 2, total: 3 },
    { name: 'Channel Divinity: Turn Undead', remaining: 14, total: 20 },
  ];
  /*
   * #141: spells, for exactly the reason the resource rows above are seeded. An UNSEEDED spell
   * list renders one empty-state line per visible level and nothing else, so the row — a 44px
   * Prepared target, a name that grows, a ✕, and six detail controls under it — is never
   * measured, and the card reports PASS at every width and theme without the thing it exists to
   * show having been looked at once.
   *
   * Seeded across three levels on purpose: the grouping is the feature, and one level would
   * measure a flat list wearing a heading. Two of them share a level so the sections have
   * different heights, and the levels are non-contiguous (0, 1, 3) so a section is never
   * measured at an index that happens to equal its level.
   *
   * The long name is the fixture that matters, same as the attack and resource rows: the name
   * is the only field on the primary line that grows, so it is the one that can push a 390px
   * row sideways past the Prepared box and the ✕ — and real spells have long names
   * ("Otiluke's Irresistible Dance" is 28 characters). The long free-text detail values do the
   * same job one level down, where six controls share a wrapping flex line.
   */
  c.spellcasting.spells = [
    // #158: a cantrip with a stale `prepared: true` (a real state — re-filing a prepared spell
    // down to level 0 makes one) and a long cantrip name, so the audit measures the section that
    // now renders WITHOUT a tick rather than assuming it looks like the others.
    { name: 'Fire Bolt', level: 0, prepared: true, castingTime: '1 action', range: '120 ft', duration: 'Instant', components: 'V, S', notes: '' },
    { name: 'Primal Savagery', level: 0, prepared: false, castingTime: '1 action', range: 'Self', duration: 'Instant', components: 'S', notes: 'Acid damage on a melee spell attack.' },
    {
      name: 'Otiluke’s Irresistible Dance', level: 3, prepared: true,
      castingTime: '1 action', range: '30 feet', duration: 'Concentration, up to 1 minute',
      components: 'V, M (a pinch of powdered silver worth 10 gp)',
      notes: 'Target dances comically; disadvantage on Dex saves and attack rolls.',
    },
    { name: 'Shield', level: 1, prepared: true, castingTime: '1 reaction', range: 'Self', duration: '1 round', components: 'V, S', notes: '' },
    { name: 'Magic Missile', level: 1, prepared: false, castingTime: '1 action', range: '120 ft', duration: 'Instant', components: 'V, S', notes: '' },
  ];
  c.proficiencies = {
    armor: 'Light, medium, heavy, shields', weapons: 'Simple, martial',
    tools: 'Smith’s tools, dice set', languages: 'Common, Dwarvish, Undercommon',
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ schemaVersion: SCHEMA_VERSION, characters: [c] }));

  const fr = document.getElementById('fr');
  fr.style.width = `${VIEWPORT}px`;
  await new Promise((res) => { fr.onload = res; fr.src = '../index.html'; });
  const d = fr.contentDocument;
  const w = fr.contentWindow;
  // setTimeout rather than requestAnimationFrame: under headless virtual time, timers are
  // fast-forwarded reliably and an animation-frame loop is not guaranteed to be driven.
  const settle = (ms = 150) => new Promise((r) => setTimeout(r, ms));
  await settle(400);

  const px = (v) => (v.endsWith('px') ? parseFloat(v) : null);

  /*
   * ---- colour, for the contrast audit -------------------------------------------------------
   *
   * Colours are painted into a 1x1 canvas and read back as bytes, NOT regex'd out of the computed
   * string. `color-mix(…, transparent)` — which this stylesheet uses for every tinted chip —
   * computes to `color(srgb …)`, so an `rgba()` regex silently fails to parse it, and a background
   * that fails to parse looks like no background at all. That is how the accent tint behind the
   * "Done" chip went missing and its contrast was first measured against the bare card: 4.38:1,
   * when the honest figure against the tint actually behind it is 3.86:1 (#118).
   */
  const cv = document.createElement('canvas');
  cv.width = 1; cv.height = 1;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  const colour = (s) => {
    if (!s || s === 'none' || s === 'transparent') return { r: 0, g: 0, b: 0, a: 0 };
    cx.clearRect(0, 0, 1, 1);
    cx.fillStyle = '#000';
    cx.fillStyle = s;                     // an unparseable value leaves fillStyle at #000
    const parsed = cx.fillStyle;
    cx.fillRect(0, 0, 1, 1);
    const p = cx.getImageData(0, 0, 1, 1).data;
    if (parsed === '#000000' && !/^(#000000|rgba?\(\s*0\s*,\s*0\s*,\s*0)/.test(s)) return null;
    return { r: p[0], g: p[1], b: p[2], a: p[3] / 255 };
  };
  const chan = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const relLum = (c) => 0.2126 * chan(c.r) + 0.7152 * chan(c.g) + 0.0722 * chan(c.b);
  const contrast = (a, b) => {
    const la = relLum(a), lb = relLum(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  };
  const over = (fg, bg) => ({
    r: fg.a * fg.r + (1 - fg.a) * bg.r,
    g: fg.a * fg.g + (1 - fg.a) * bg.g,
    b: fg.a * fg.b + (1 - fg.a) * bg.b,
    a: 1,
  });
  const hex = (c) => `#${[c.r, c.g, c.b].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('')}`;

  /*
   * The colour actually behind an element's text: walk up compositing every translucent layer
   * until the first opaque one. Which variable a rule NAMES proves nothing about what ends up
   * behind the glyphs — the active tab names `--accent` on a `color-mix(accent 12%, card)`
   * background, and the tint is the thing that decides whether it passes.
   */
  const effectiveBg = (el) => {
    const layers = [];
    for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
      const bg = colour(w.getComputedStyle(n).backgroundColor);
      if (!bg || bg.a === 0) continue;
      layers.push(bg);
      if (bg.a === 1) break;
    }
    // No opaque layer found at all: the page background is the canvas, which is --parchment on
    // body; fall back to white only if even that is transparent.
    let base = layers.length ? layers[layers.length - 1] : { r: 255, g: 255, b: 255, a: 1 };
    for (let i = layers.length - 2; i >= 0; i--) base = over(layers[i], base);
    return base;
  };

  /*
   * The tap target is not the border box. `.pip` and `.toggle` deliberately keep a small
   * visible box and carry the real target on an absolutely-positioned `::after` (style.css).
   * So the honest hit rect is the border box UNION any absolutely-positioned pseudo-element.
   *
   * Read analytically from the computed pseudo styles rather than probing with
   * elementFromPoint: a point walk is quantised by its own step size and under-reports a
   * 44px target by a couple of px, which is exactly the margin these decisions turn on.
   */
  function hitRect(el) {
    const r = el.getBoundingClientRect();
    let { left, top, right, bottom } = r;
    for (const pseudo of ['::after', '::before']) {
      const cs = w.getComputedStyle(el, pseudo);
      if (!cs || cs.content === 'none' || cs.position !== 'absolute') continue;
      const l = px(cs.left), t = px(cs.top), rt = px(cs.right), b = px(cs.bottom);
      if ([l, t, rt, b].some((v) => v === null)) continue;   // `auto` — can't resolve statically
      /*
       * Offsets resolve against the padding box of the nearest POSITIONED ancestor, so this
       * union is only valid when that ancestor is the element itself — which held for every
       * owner here, because each one (`input[type=checkbox]`, `.pip`, `.toggle`) sets
       * `position: relative` for exactly this reason. Guarding it anyway: on a static owner the
       * pseudo is somewhere else entirely, and inflating the border box by insets that resolved
       * against a distant ancestor would report a tap target that does not exist. Defensive, not
       * a fix for a past false pass — see escapedPseudos() for who owns that case now.
       */
      if (w.getComputedStyle(el).position === 'static') continue;
      left = Math.min(left, r.left + l);
      top = Math.min(top, r.top + t);
      right = Math.max(right, r.right - rt);
      bottom = Math.max(bottom, r.bottom - b);
    }
    return { w: +(right - left).toFixed(1), h: +(bottom - top).toFixed(1) };
  }

  const label = (el) => {
    const id = el.id ? `#${el.id}` : '';
    const cls = el.classList.length ? `.${[...el.classList].join('.')}` : '';
    return `${el.tagName.toLowerCase()}${id}${cls}`;
  };

  /*
   * What an absolutely-positioned descendant of `el` would resolve its insets against, named.
   *
   * NOT `offsetParent`: for a rendered static element with no positioned ancestor that returns
   * `body`, which is emphatically not the containing block — the insets resolve against the
   * initial containing block, and `body`'s padding box is the document's height, not the
   * viewport's. `offsetParent` is null only when the element isn't rendered at all. Reading it
   * the other way round labels the one case this probe exists to name (#115) as "body" and saves
   * the words "initial containing block" for the harmless unpainted case.
   *
   * `position` is not the only thing that establishes a containing block for abspos descendants —
   * `transform`, `filter` and `backdrop-filter` do too, and this stylesheet uses all three (the
   * topbar and tab bar blur their backdrops, the drawer slides on a transform). They are checked
   * so the name is trustworthy, even though every one of them here is also fixed or sticky.
   */
  const containingBlockOf = (el) => {
    for (let n = el.parentElement; n && n.nodeType === 1; n = n.parentElement) {
      const cs = w.getComputedStyle(n);
      if (cs.position !== 'static') return label(n);
      if (cs.transform !== 'none' || cs.filter !== 'none') return label(n);
      if ((cs.backdropFilter || 'none') !== 'none') return label(n);
    }
    return 'the initial containing block';
  };

  // The nearest fixed/sticky ancestor, i.e. which piece of app chrome an element belongs to
  // (topbar, tab bar, arrange bar, sidebar) — or null for ordinary in-flow sheet content.
  const fixedChromeAncestor = (el) => {
    for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
      const p = w.getComputedStyle(n).position;
      if (p === 'fixed' || p === 'sticky') return label(n);
    }
    return null;
  };

  // Anything a finger is meant to land on.
  const SELECTOR = [
    'button', 'input:not([type="hidden"])', 'select', 'textarea',
    '[role="tab"]', '[role="button"]', 'summary', '[data-action]', '.chip',
  ].join(',');

  /*
   * The condition chips use the label-wraps-checkbox idiom: the 44px `<label>` is the tap
   * target and the box inside it stays small on purpose (style.css `.chip` — "the label IS
   * the tap target (#77)"). Flagging the inner 22px checkbox there would be a false positive,
   * so a control is excused when a wrapping <label> already meets the minimum.
   */
  function coveredByLabel(el) {
    const lab = el.closest('label');
    if (!lab) return false;
    const r = hitRect(lab);
    return r.w + 0.5 >= TAP && r.h + 0.5 >= TAP;
  }

  /*
   * A field whose value is wider than its box shows a truncated word with no indication that
   * anything is missing — a read-only field in play mode cannot even be scrolled to reveal the
   * rest. That is a different failure from a small tap target or a scrolling document, and
   * neither of the other two measurements can see it: the layout is perfectly well-behaved,
   * it is the content that has been silently cut.
   *
   * Text inputs only. A textarea grows (field-sizing) and a number field holds a number.
   */
  function clippedFields() {
    const out = [];
    for (const el of sceneRoot().querySelectorAll('input[type="text"]')) {
      const box = el.getBoundingClientRect();
      if (box.width === 0 && box.height === 0) continue;
      if (!el.value) continue;
      if (el.scrollWidth <= el.clientWidth + 1) continue;
      if (el.closest('.row__primary')) continue;   // counted separately — see truncatedRowNames
      out.push(`${label(el)} "${el.value}" needs ${el.scrollWidth} in ${el.clientWidth}`);
    }
    return out;
  }

  /**
   * The same measurement for a LIST ROW's name field, reported but not fatal (#154).
   *
   * This is a decision, not an exemption, and it is worth being precise about which. A spell row
   * is one line by design: the card is eighteen rows deep and the sheet's whole job there is
   * scanning it, so when a name cannot fit beside the tick and the two buttons, the name gives
   * way and ellipsizes rather than the row growing to 96px and putting two lone controls under a
   * title. Measured at 390px in Edit, that costs the last ~6 characters of a 28-character name;
   * in play mode, where a player spends essentially all of their time and the ✕ is hidden,
   * nothing in a normal spell list truncates at all.
   *
   * So the number stays measured and stays printed — a regression that starts cropping every name
   * in the card is still visible here, and so is one that starts cropping a field OUTSIDE a row,
   * which remains a hard failure. What changed is only that a truncation the owner asked for no
   * longer flips four runs to FAIL, because an assertion that is expected to fail teaches people
   * to ignore the report.
   */
  function truncatedRowNames() {
    const out = [];
    for (const el of sceneRoot().querySelectorAll('.row__primary input[type="text"]')) {
      const box = el.getBoundingClientRect();
      if (box.width === 0 && box.height === 0) continue;
      if (!el.value) continue;
      if (el.scrollWidth <= el.clientWidth + 1) continue;
      out.push(`${label(el)} "${el.value}" needs ${el.scrollWidth} in ${el.clientWidth}`);
    }
    return out;
  }

  /*
   * A control that renders at the right size and cannot be tapped anyway, because something
   * invisible sits on top of it. This is the check that was missing when #115 shipped: a
   * `<span class="skill__exp">` spacer inherited `.skill__exp::after{position:absolute;
   * inset:-11px}` — a 44px tap target written for the checkbox twin. A span gets no
   * `position: relative`, so the pseudo resolved against the INITIAL CONTAINING BLOCK and
   * became a viewport-sized invisible sheet anchored at the document origin, six deep, over
   * every control in the top screenful. Everything measured 44px. Nothing above the fold
   * worked. The stylesheet has produced this exact class of thing before (see the
   * `.visually-hidden width:100%` note in the overflow verdict below).
   *
   * `elementFromPoint` is the only honest test here: it answers "what would the finger hit",
   * so it accounts for stacking, `pointer-events`, ancestor clipping and covering layers at
   * once — none of which are readable from the cascade. It reports the ORIGINATING element for
   * a pseudo-element, which is what makes the culprit above nameable.
   *
   * Reachability is tested at SEVERAL scroll offsets, and a control is only reported when every
   * one of them fails. That is not thoroughness for its own sake — it is the whole distinction
   * between the two ways a control gets covered, which one offset cannot tell apart:
   *
   *   - A fixed overlay (topbar, tab bar, the tall arrange bar) covers a band of the VIEWPORT.
   *     Content behind it is reached by scrolling; obscuring it at one offset is the design, and
   *     reporting it means 54 findings that are all "the bottom bar is at the bottom".
   *   - An absolutely-positioned box with no positioned ancestor covers a band of the DOCUMENT.
   *     No scroll offset escapes it. That is #115, and it is a real bug.
   *
   * A full-viewport scrim left hit-testable fails at every offset too, so it still reports —
   * which is the other thing CLAUDE.md warns has bitten this app.
   *
   * Several points per offset, not just the centre: `getBoundingClientRect` on an inline element
   * fragmented across lines returns a union whose centre lands in neither fragment.
   *
   * The zero-rect test is NOT enough to decide a control is on screen. Chrome closes a
   * `<details>` with content containment rather than `display: none`, so everything inside the
   * Conditions disclosure and the arrange bar's `.arrange-more` keeps a stale non-zero rect
   * while being correctly un-hit-testable — 83 controls' worth of confident nonsense, naming
   * whichever unrelated tile happens to sit at those coordinates as the culprit. `<details>` is
   * the app's own idiom for "not on screen right now", so this defers to it.
   */
  /*
   * The scene's root (#149). A modal <dialog> puts the rest of the document in the top layer's
   * inert shadow: by spec nothing outside it can be tapped, tabbed to or hit-tested. So with the
   * spell picker open, the sheet behind it is not a page full of covered controls — it is
   * correctly switched off, and walking it would report every control on the page as blocked by
   * one element, which is the exact shape of the scrim bug the heuristic below exists to shout
   * about. Scope every walk to the dialog instead, and measure the thing that is actually on
   * screen.
   */
  const sceneRoot = () => d.querySelector('dialog[open]') ?? d;

  function coveredControls() {
    const out = [];
    // Controls skipped because transient chrome is over them, tallied per blocker: a bar covering
    // a band is the design, but one element covering most of a scene is the scrim bug below.
    const behindChrome = new Map();
    let considered = 0;
    for (const el of sceneRoot().querySelectorAll(SELECTOR)) {
      const box = el.getBoundingClientRect();
      if (box.width === 0 && box.height === 0) continue;
      const cs = w.getComputedStyle(el);
      if (cs.visibility === 'hidden') continue;
      if (el.closest('details:not([open])')) continue;
      if (el.checkVisibility && !el.checkVisibility({ contentVisibilityAuto: true })) continue;
      /*
       * `pointer-events: none` is a control switched off on purpose, not one covered by accident.
       * Arrange mode inerts the whole sheet this way (`body.is-arranging .card`) so a tap selects
       * a tile instead of typing into a field — every character input in a non-tile card computes
       * `none` there, and `elementFromPoint` correctly answers with the panel behind it. Whether
       * that gating is RIGHT is a question about the ACTIONS map, not about hit-testing: see #115
       * / the brief's §2, where an action inside a tile fires during arrange anyway.
       */
      if (cs.pointerEvents === 'none') continue;
      considered++;

      // The chips put the tap target on the wrapping <label> on purpose (style.css `.chip`), so
      // the label answering for its own checkbox is correct, not a cover.
      const lab = el.closest('label');
      const isHit = (t) => t === el || el.contains(t) || (lab !== null && t === lab);

      let blocker = null, reachable = false, sampled = false;
      for (const block of ['center', 'start', 'end']) {
        el.scrollIntoView({ block, inline: 'center' });
        const r = el.getBoundingClientRect();
        for (const fx of [0.5, 0.25, 0.75]) {
          for (const fy of [0.5, 0.25, 0.75]) {
            const x = r.left + r.width * fx, y = r.top + r.height * fy;
            // Off-screen even after scrolling (a control wider than the viewport, or one inside
            // its own scroller) is a different failure; the overflow verdict owns it.
            if (x < 0 || y < 0 || x > w.innerWidth || y > w.innerHeight) continue;
            sampled = true;
            const t = d.elementFromPoint(x, y);
            if (isHit(t)) { reachable = true; break; }
            // Report the centre-of-viewport blocker: it is the one clear of the fixed bars, so
            // it names the thing actually in the way rather than whichever chrome is at an edge.
            if (t && (blocker === null || block === 'center')) blocker = t;
          }
          if (reachable) break;
        }
        if (reachable) break;
      }
      if (reachable || !sampled || blocker === null) continue;
      /*
       * A blocker inside fixed or sticky chrome is the app's own furniture — the sticky topbar,
       * the fixed tab bar, the sticky arrange bar (489px tall with its disclosure open, over half
       * this viewport). Content behind those is reached by closing the disclosure or scrolling,
       * and reporting it buries the real finding under 20 lines of "the bar is where the bar is".
       */
      const chrome = fixedChromeAncestor(blocker);
      if (chrome) {
        behindChrome.set(chrome, (behindChrome.get(chrome) ?? 0) + 1);
        continue;
      }
      out.push(`${label(el)} covered by ${label(blocker)}`);
    }
    /*
     * ...but a single overlay swallowing MOST of a scene is not furniture, it is the scrim bug
     * CLAUDE.md warns about — an author `display` beating `[hidden]{display:none!important}`
     * leaves a full-screen layer hit-testable and nothing on the sheet responds. A bar covers a
     * band; a scrim covers everything. The ratio is what tells them apart, so the exemption
     * above cannot launder it.
     */
    for (const [chrome, n] of behindChrome) {
      if (considered && n / considered >= 0.5) {
        out.push(`${chrome} covers ${n} of ${considered} controls — a full-page overlay, not a bar`);
      }
    }
    return out;
  }

  /*
   * The #115 root cause stated directly, rather than caught by its consequence: an absolutely
   * positioned pseudo-element with real insets, on an owner that is `position: static`. The
   * insets then resolve against some ancestor's padding box — or, with no positioned ancestor at
   * all, against the initial containing block — so the box lands somewhere its author never
   * looked, at viewport scale, invisible and hit-testable.
   *
   * This walks every element, not just the controls in SELECTOR, and that is the point: the
   * #115 owner was an empty `<span>` spacer, which is not a control and was therefore outside
   * everything the size audit looked at. Nothing measured it, and nothing could have — the union
   * in hitRect only ever inflates an owner's own border box, so it cannot see where an escaped
   * pseudo actually landed. Only the covered-control check below noticed, and only via the 60
   * unrelated controls it took down. This says it in one line instead.
   *
   * Every such pseudo in this stylesheet is a 44px tap target on a control that sets
   * `position: relative` itself, so the honest invariant is zero.
   */
  function escapedPseudos() {
    const found = new Map();
    for (const el of sceneRoot().querySelectorAll('*')) {
      if (w.getComputedStyle(el).position !== 'static') continue;
      for (const pseudo of ['::after', '::before']) {
        const cs = w.getComputedStyle(el, pseudo);
        if (!cs || cs.content === 'none' || cs.position !== 'absolute') continue;
        // All-`auto` insets keep the box in the static position — no escape, nothing to report.
        if ([cs.top, cs.right, cs.bottom, cs.left].every((v) => v === 'auto')) continue;
        const key = `${label(el)}${pseudo} is absolute with insets on a static owner`
          + ` → resolves against ${containingBlockOf(el)}`;
        /*
         * The size is carried beside the key rather than inside it. One bad rule is one finding
         * (see the dedup at the verdict), and an `auto` width means only that the owner is not
         * rendered in THIS scene — the same rule reports a real box in the scene that paints it.
         * With the size in the key those two became separate findings and the headline said "2
         * pseudo-elements escape their owner" for a single rule.
         */
        const size = cs.width === 'auto' ? null : `${cs.width}x${cs.height}`;
        const prev = found.get(key);
        // Prefer a scene that actually painted it: a measured box is the evidence.
        if (!prev || (!prev.size && size)) found.set(key, { size, count: (prev?.count ?? 0) + 1 });
        else found.set(key, { size: prev.size, count: prev.count + 1 });
      }
    }
    return [...found.entries()].map(([k, v]) => ({
      key: k,
      // Still reported when nothing painted it: the rule is wrong either way, and catching it
      // before the state that paints it is the point.
      detail: `${k} (${v.size || 'not rendered in this scene'}, ${v.count} owner(s))`,
    }));
  }

  /*
   * Text contrast (#118). WCAG AA wants 4.5:1, or 3:1 for large text — >=24px, or >=18.66px when
   * bold. Reported per element kind, with the measured pair, because "which variable is wrong" is
   * only answerable from the actual foreground/background it resolved to.
   *
   * Runs in whatever theme the browser reports, which is why the verdict names it: headless Chrome
   * says `prefers-color-scheme: dark` by DEFAULT, so a light-vs-dark comparison run without
   * `--blink-settings=preferredColorScheme=1` is two dark runs agreeing with each other. Both
   * themes have to be run, the same way both widths do.
   *
   * Disabled controls are skipped: WCAG exempts inactive components, and the placement drop slots
   * deliberately grey out the two gaps a tile is already in.
   */
  function contrastFailures() {
    const found = new Map();
    for (const el of sceneRoot().querySelectorAll('*')) {
      // Own text only — an element whose text lives in children is styled by those children.
      const own = [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim());
      if (!own) continue;
      if (el.closest('details:not([open])')) continue;
      if (el.closest(':disabled, [aria-disabled="true"]')) continue;
      if (el.checkVisibility && !el.checkVisibility({ contentVisibilityAuto: true })) continue;
      const box = el.getBoundingClientRect();
      // Not `=== 0`: `.visually-hidden` pins its box to 1x1 and clips, so screen-reader-only
      // labels are technically rendered and technically fail a contrast check that means nothing
      // for them. Nothing legible fits in 2px either way.
      if (box.width <= 2 || box.height <= 2) continue;
      const cs = w.getComputedStyle(el);
      if (cs.visibility === 'hidden' || Number(cs.opacity) === 0) continue;
      const fg = colour(cs.color);
      if (!fg || fg.a === 0) continue;
      const bg = effectiveBg(el);
      const ratio = contrast(over(fg, bg), bg);
      const size = parseFloat(cs.fontSize), weight = Number(cs.fontWeight) || 400;
      const need = (size >= 24 || (size >= 18.66 && weight >= 700)) ? 3 : 4.5;
      if (ratio + 0.005 >= need) continue;
      const key = `${label(el)} ${hex(over(fg, bg))} on ${hex(bg)}`
        + ` = ${ratio.toFixed(2)}:1, needs ${need} [${size}px/${weight}]`;
      found.set(key, (found.get(key) ?? 0) + 1);
    }
    return [...found.entries()].map(([k, n]) => (n > 1 ? `${k} (x${n})` : k));
  }

  /**
   * WCAG 1.4.11 — the boundary of a CONTROL, not its text (#159).
   *
   * The contrast audit above reads text only, and that gap shipped an app in which every
   * unchecked checkbox was invisible: `input:read-only` matches checkboxes, so a rule meant for
   * locked text fields painted `border-color: transparent` over all of them. Nothing here
   * measured a control's own edge, so four runs of PASS said nothing about whether the PROF and
   * EXP columns of Abilities & Skills had anything in them. They did not.
   *
   * What counts as the visible edge: the border if it is not transparent, otherwise the
   * background. If BOTH are transparent the control has no edge at all, which is 1.00:1 and the
   * failure this exists to name. Checkboxes only for now — they are the controls this stylesheet
   * draws itself from scratch; a <button> carries text the contrast audit already reads.
   */
  function controlEdgeFailures() {
    const found = new Map();
    for (const el of sceneRoot().querySelectorAll('input[type="checkbox"], input[type="radio"]')) {
      const box = el.getBoundingClientRect();
      if (box.width <= 2 || box.height <= 2) continue;
      if (el.closest('details:not([open])')) continue;
      if (el.closest(':disabled, [aria-disabled="true"]') || el.disabled) continue;
      if (el.checkVisibility && !el.checkVisibility({
        contentVisibilityAuto: true, visibilityProperty: true,
      })) continue;
      const cs = w.getComputedStyle(el);
      const border = colour(cs.borderTopColor);
      const fill = colour(cs.backgroundColor);
      // The edge a player can actually see. A transparent border over a transparent fill is a
      // control with no boundary at all — the #159 case, and it lands here as 1.00:1.
      const edge = border && border.a > 0 ? border : fill;
      /*
       * From the PARENT up, not from the element. `effectiveBg` composites the element's own
       * background first, which is right for text — text sits on its own background — and wrong
       * for an edge, which is judged against what surrounds it. The first run of this check
       * reported a TICKED box as "#d08477 on #d08477 = 1.00:1": the accent fill measured against
       * itself. The failure it exists to catch is the opposite one, so a false alarm here would
       * have been the fastest way to get the whole check deleted.
       */
      const bg = effectiveBg(el.parentElement || el);
      if (!edge) continue;
      const ratio = contrast(over(edge, bg), bg);
      if (ratio + 0.005 >= 3) continue;
      const key = `${label(el)} edge ${hex(over(edge, bg))} on ${hex(bg)} = ${ratio.toFixed(2)}:1, needs 3`;
      found.set(key, (found.get(key) ?? 0) + 1);
    }
    return [...found.entries()].map(([k, n]) => (n > 1 ? `${k} (x${n})` : k));
  }

  function auditScene(name) {
    const groups = new Map();
    const seen = new Set();
    for (const el of sceneRoot().querySelectorAll(SELECTOR)) {
      if (seen.has(el)) continue;
      seen.add(el);
      const box = el.getBoundingClientRect();
      if (box.width === 0 && box.height === 0) continue;          // not rendered in this scene
      if (w.getComputedStyle(el).visibility === 'hidden') continue;
      const hit = hitRect(el);
      if (hit.w + 0.5 >= TAP && hit.h + 0.5 >= TAP) continue;
      if (coveredByLabel(el)) continue;
      // Identical controls repeat dozens of times (42 skill checkboxes, 48 arrange buttons);
      // group them so the report reads as findings rather than as a wall.
      const key = `${label(el)}|${Math.round(box.width)}x${Math.round(box.height)}|${hit.w}x${hit.h}`;
      const row = groups.get(key) ?? {
        el: label(el),
        box: `${Math.round(box.width)}x${Math.round(box.height)}`,
        hit: `${hit.w}x${hit.h}`,
        short: +Math.min(hit.w, hit.h).toFixed(1),
        count: 0,
      };
      row.count++;
      groups.set(key, row);
    }
    const rows = [...groups.values()].sort((a, b) => a.short - b.short);
    return {
      scene: name,
      viewport: w.innerWidth,
      scrollWidth: d.documentElement.scrollWidth,
      overflows: d.documentElement.scrollWidth > w.innerWidth,
      clipped: clippedFields(),
      truncatedNames: truncatedRowNames(),
      covered: coveredControls(),
      escaped: escapedPseudos(),
      contrast: contrastFailures(),
      controlEdges: controlEdgeFailures(),
      failures: rows,
    };
  }

  const tab = async (id) => { d.getElementById(`tab-${id}`)?.click(); await settle(); };
  const edit = async (card) => {
    d.querySelector(`[data-editcard="${card}"] .card__edit`)?.click();
    await settle();
  };

  // Named in the report because a PASS means nothing without it: headless Chrome reports dark by
  // default, so an unflagged "light" run is a second dark run. See CLAUDE.md.
  const THEME = w.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const report = { viewport: VIEWPORT, theme: THEME, tap: TAP, scenes: [] };

  await tab('combat');
  report.scenes.push(auditScene('combat / view'));
  await edit('combat');
  report.scenes.push(auditScene('combat / edit'));
  await edit('combat');

  await tab('abilities');
  report.scenes.push(auditScene('abilities / view'));
  await edit('abilities');
  report.scenes.push(auditScene('abilities / edit'));
  await edit('abilities');

  // The spell-slot total field exists ONLY while the Spell Slots card is in edit mode — play
  // mode renders a remaining/total count instead (render.js renderSlots). Keyed to 'spellslots'
  // since the split: the slots left the Spellcasting card, and editing the wrong one here would
  // measure a scene with no total inputs in it while still reporting PASS.
  await tab('spells');
  report.scenes.push(auditScene('spells / view'));
  await edit('spellslots');
  report.scenes.push(auditScene('spells / slot setup'));
  await edit('spellslots');

  /*
   * #141: the spell list has three states worth measuring and the two above reach only one.
   *
   * Play mode shows the stocked levels open, which the 'spells / view' scene covers. Edit shows
   * all TEN sections with their fields unlocked and their disclosures shut — a different set of
   * controls (the level <select> and the per-section "+ Add" exist only here). And a row's
   * detail block is `display:none` until the row is expanded, so its six controls are invisible
   * to every measurement until something opens one.
   *
   * The sections are opened directly rather than by clicking each summary: a click is the
   * gesture probe-spells.html tests, and here the point is only to get the controls on screen
   * so they can be sized and contrast-checked.
   */
  await edit('spells');
  // #155: a level is a section with a class, not a <details>. Opened directly rather than by
  // clicking each heading — the gesture is probe-spells.html's job; here the point is only to
  // get the controls on screen so they can be sized and contrast-checked.
  for (const level of d.querySelectorAll('.spelllevel')) level.classList.remove('is-collapsed');
  for (const row of d.querySelectorAll('.row--spell')) row.classList.add('is-expanded');
  await settle(200);
  report.scenes.push(auditScene('spells / list edit, rows expanded'));
  await edit('spells');

  /*
   * #149: the spell picker. A modal dialog with a search box, three axes of filter chips, a
   * result list and an expandable description — the largest new surface since arrange mode, and
   * none of it is on the sheet, so no other scene reaches a single control in it.
   *
   * Opened from the FIRST section (cantrips) purely because it is the first; the filters and the
   * first result are opened by hand so the chips and the description text get measured too. The
   * dialog has to be closed again before the arrange scenes, which need the sheet back.
   */
  await edit('spells');
  d.querySelector('#spells .spelllevel__add')?.click();
  await settle(1500);                       // the 330KB library arrives by dynamic import
  d.querySelector('.picker__filters')?.setAttribute('open', '');
  d.querySelector('#spell-results .result')?.classList.add('is-expanded');
  await settle(400);
  report.scenes.push(auditScene('spells / picker open'));
  d.querySelector('#spell-picker')?.close();
  await settle(200);
  await edit('spells');

  await tab('gear');
  report.scenes.push(auditScene('gear / view'));

  /*
   * #145/#147: Features & Feats, which lives on this tab, has three states and the scene above
   * reaches one. Edit adds the ✕ and the two "+ Add" buttons; a row's detail block (source /
   * level / description textarea) is `display:none` until something opens it, so its controls are
   * invisible to every measurement until then — and as of #147 that is true in Edit mode too,
   * which is the change: Edit used to force every block open, so this scene would have measured
   * them by accident and stopped doing so silently.
   *
   * Opened by setting the class rather than clicking the button, for the same reason the spell
   * sections are: the gesture is what probe-detail-rows.html tests, and the job here is only to
   * get the controls on screen so they can be sized and contrast-checked.
   */
  await edit('features');
  for (const row of d.querySelectorAll('#features .row--feature, #feats .row--feat')) {
    row.classList.add('is-expanded');
  }
  await settle(200);
  report.scenes.push(auditScene('gear / features edit, rows expanded'));
  await edit('features');
  await tab('character');
  report.scenes.push(auditScene('character / view'));

  await tab('combat');
  d.querySelector('[data-action="arrange-toggle"]')?.click();
  await settle(250);
  report.scenes.push(auditScene('arrange / nothing selected'));

  /*
   * Three arrange scenes, because the mode's controls are no longer all on screen at once
   * (#72/#73). The object toolbar exists only once a tile is selected, and tab editing plus the
   * two layout-default buttons live behind a disclosure — auditing only the landing state would
   * silently skip most of the mode's controls and still report PASS.
   */
  d.querySelector('#panel-combat [data-object]')?.click();
  await settle(250);
  report.scenes.push(auditScene('arrange / tile selected'));

  // The drop targets only exist mid-gesture, and they are the touch surface the whole reorder
  // path rests on (#73) — audit them where they live.
  d.querySelector('[data-action="place-object-start"]')?.click();
  await settle(250);
  report.scenes.push(auditScene('arrange / placing a tile'));
  d.querySelector('[data-action="place-object-cancel"]')?.click();
  await settle(250);

  d.querySelector('.arrange-more')?.setAttribute('open', '');
  await settle(250);
  report.scenes.push(auditScene('arrange / tabs & defaults open'));

  d.querySelector('.arrange-bar [data-action="arrange-toggle"]')?.click();
  await settle();

  report.scenes = report.scenes.filter(
    (s) => s.failures.length || s.overflows || s.clipped.length || s.covered.length
      || s.escaped.length || s.contrast.length || s.truncatedNames.length || s.controlEdges.length,
  );
  report.totalFailures = report.scenes.reduce(
    (n, s) => n + s.failures.reduce((m, f) => m + f.count, 0), 0,
  );

  /*
   * Sideways scroll is a FAILURE, not a footnote. `overflows` was already measured per scene,
   * but the verdict only counted touch targets — so the probe printed PASS while the document
   * scrolled 655px against a 375px viewport, and anyone reading just the verdict line (me) saw
   * a green light. CLAUDE.md forbids body horizontal scroll; the probe now says so.
   *
   * Two ways it has actually happened here, both invisible on screen: a row whose content
   * cannot shrink (a long attack name against a `flex: 0 0 auto` damage field), and a
   * `.visually-hidden` element given `width: 100%` — absolutely positioned with no positioned
   * ancestor, so it resolves against the viewport and hangs a 375px empty box off the edge.
   */
  report.overflowScenes = report.scenes
    .filter((s) => s.overflows)
    .map((s) => `${s.scene}: scrollWidth ${s.scrollWidth} > ${s.viewport}`);

  // Deduplicated: the same field is measured once per scene it appears in, and one cropped
  // Name would otherwise be reported eight times.
  report.clippedFields = [...new Set(report.scenes.flatMap((s) => s.clipped))];
  /*
   * #154: a row name that ellipsizes is the design, so this is a NOTE on the verdict rather than
   * a failure — see truncatedRowNames(). Deduplicated the same way, and printed even on a PASS,
   * because the point of measuring it is that someone reads the number.
   */
  report.truncatedRowNames = [...new Set(report.scenes.flatMap((s) => s.truncatedNames))];

  /*
   * Reported per scene, not deduplicated to a flat set like the cropped fields: WHICH scene a
   * control is unreachable in is the whole finding. #115 is only true with the Abilities card
   * in edit mode, and it takes out controls in other cards entirely — "Done in Inventory is
   * dead once you have opened Abilities" is a sentence you can only read off the scene.
   */
  report.coveredControls = report.scenes
    .filter((s) => s.covered.length)
    .map((s) => `${s.scene}: ${s.covered.length} covered — ${[...new Set(s.covered)].slice(0, 6).join('; ')}`);
  const coveredTotal = report.scenes.reduce((n, s) => n + s.covered.length, 0);

  /*
   * Deduplicated across scenes on the RULE, not on the rendered detail: one bad rule is one
   * finding, not one per tab it renders on. The scene that painted the box wins, because a
   * measured size is the evidence — an unpainted scene only proves the rule exists.
   */
  const escaped = new Map();
  for (const s of report.scenes) {
    for (const e of s.escaped) {
      const prev = escaped.get(e.key);
      if (!prev || (prev.includes('not rendered') && !e.detail.includes('not rendered'))) {
        escaped.set(e.key, e.detail);
      }
    }
  }
  report.escapedPseudos = [...escaped.values()];

  // Deduplicated across scenes: one wrong colour pairing is one finding, however many tabs it
  // appears on. The count in each line is per scene, which is the useful number (12 tile labels
  // on one Combat screen reads differently from one stray hint).
  report.contrastFailures = [...new Set(report.scenes.flatMap((s) => s.contrast))];
  // #159: a control whose own boundary is under 3:1 — the audit's blind spot until an entire
  // app's worth of checkboxes turned out to be painting nothing at all.
  report.controlEdgeFailures = [...new Set(report.scenes.flatMap((s) => s.controlEdges))];

  const parts = [];
  if (report.contrastFailures.length) parts.push(`${report.contrastFailures.length} text colour pairing(s) under WCAG AA`);
  if (report.controlEdgeFailures.length) parts.push(`${report.controlEdgeFailures.length} control edge(s) under 3:1 (WCAG 1.4.11)`);
  if (report.escapedPseudos.length) parts.push(`${report.escapedPseudos.length} pseudo-element(s) escape their owner`);
  if (report.totalFailures) parts.push(`${report.totalFailures} control(s) under ${TAP}px`);
  if (report.overflowScenes.length) parts.push(`${report.overflowScenes.length} scene(s) scroll sideways`);
  if (report.clippedFields.length) parts.push(`${report.clippedFields.length} field(s) crop their value`);
  if (coveredTotal) parts.push(`${coveredTotal} control(s) covered by something else`);
  // A row name ellipsizing is a decision (#154), so it rides along as a NOTE — never silent,
  // never fatal. Anything else cropping its value is still a failure above.
  const note = report.truncatedRowNames.length
    ? ` [note: ${report.truncatedRowNames.length} row name(s) ellipsize by design — ${report.truncatedRowNames[0]}]`
    : '';
  report.verdict = (parts.length === 0
    ? `PASS — at ${VIEWPORT}px in the ${THEME} theme, every measured control has a >=${TAP}px hit area and is the thing a tap would actually hit, every text colour clears WCAG AA against what is actually behind it, every control's own edge clears 3:1, nothing scrolls sideways, and no field outside a list row crops its value`
    : `FAIL — at ${VIEWPORT}px in the ${THEME} theme: ${parts.join('; ')}`) + note;
  out.textContent = JSON.stringify(report, null, 1);
} catch (err) {
  out.textContent = `PROBE ERROR\n${err && err.stack || err}`;
}
</script>
