<!doctype html>
<meta charset="utf-8">
<title>Delegated dispatch probe (#125)</title>
<!--
  The dispatch tables in main.js are FIRST MATCH WINS, which is only safe because the routes
  are mutually exclusive. That claim is the kind that rots quietly: someone adds a route with
  a broader selector, an element starts matching two, the later one stops running, and nothing
  fails — the feature just goes silent for whichever case overlaps.

  So this walks every element in the live DOM, across every tab and both modes, and fails if
  any element matches more than one route in the same table. It also checks that the tables
  still route the things they are supposed to, because a table that matches nothing is
  trivially "disjoint".

  Run it the same way as the others; see CLAUDE.md → "Measuring the running app".
-->
<style>
  body { margin: 0; font: 12px/1.45 ui-monospace, monospace; }
  #fr { width: 390px; height: 900px; border: 0; }
</style>
<pre id="out">pending</pre>
<iframe id="fr"></iframe>
<script type="module">
const out = document.getElementById('out');
const L = [];
let fails = 0;
const ok = (name, pass, detail = '') => {
  if (!pass) fails++;
  L.push(`${pass ? 'PASS' : 'FAIL'}  ${name}${detail ? '   ' + detail : ''}`);
};

try {
  if (navigator.serviceWorker) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map((r) => r.unregister()));
  }
  if (window.caches) { const k = await caches.keys(); await Promise.all(k.map((x) => caches.delete(x))); }

  const { STORAGE_KEY, SCHEMA_VERSION, blankCharacter } = await import('../js/constants.js');
  const c = blankCharacter();
  c.name = 'Thorin'; c.class = 'Fighter'; c.level = 5;
  c.hp.max = 30; c.hp.current = 20; c.ac = 15; c.speed = 30;
  c.spellcasting.ability = 'int';
  c.spellcasting.slots[1] = { total: 4, used: 1 };
  c.attacks = [{ name: 'Dagger', ability: 'dex', proficient: true, damage: '1d4', notes: '' }];
  c.inventory = [{ name: 'Rope', qty: 1, notes: '' }];
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ schemaVersion: SCHEMA_VERSION, characters: [c] }));
  localStorage.removeItem('dnd-character-sheets:layout');
  localStorage.removeItem('dnd-character-sheets:layout-default');

  const fr = document.getElementById('fr');
  await new Promise((res) => { fr.onload = res; fr.src = '../index.html'; });
  const d = fr.contentDocument, w = fr.contentWindow;
  const settle = (ms = 200) => new Promise((r) => setTimeout(r, ms));
  await settle(600);

  const tables = w.__dispatchRoutes;
  ok('the dispatch tables are reachable', Boolean(tables && tables.INPUT_ROUTES && tables.CHANGE_ROUTES));
  if (!tables) throw new Error('no __dispatchRoutes — did the dispatch refactor land?');

  // --- every element, every tab, and arrange mode too --------------------------------------
  const overlaps = [];
  const routed = { INPUT_ROUTES: new Map(), CHANGE_ROUTES: new Map() };

  function sweep(where) {
    for (const el of d.querySelectorAll('*')) {
      for (const key of ['INPUT_ROUTES', 'CHANGE_ROUTES']) {
        const hits = tables[key].filter((r) => {
          try { return Boolean(r.find(el)); } catch { return false; }
        });
        if (hits.length > 1) {
          overlaps.push(`${where}: <${el.tagName.toLowerCase()}${el.id ? '#' + el.id : ''}` +
            `${el.className ? '.' + String(el.className).split(/\s+/)[0] : ''}> matches ` +
            `${key} [${hits.map((h) => h.name).join(' + ')}]`);
        }
        // Count the WINNER, not only unambiguous matches: an overlapping element still
        // routes somewhere, and skipping it made "resize slider" read 0 elements while the
        // slider was in fact being handled. A coverage count that drops the interesting
        // cases is worse than none.
        if (hits.length >= 1) {
          routed[key].set(hits[0].name, (routed[key].get(hits[0].name) || 0) + 1);
        }
      }
    }
  }

  const tabs = [...d.querySelectorAll('[role="tab"]')];
  for (const t of tabs) { t.click(); await settle(200); sweep(`tab ${t.textContent.trim()}`); }

  // Arrange mode adds the rename fields and the resize sliders — the routes most likely to
  // collide with each other, and absent from the DOM entirely until the mode is on.
  d.getElementById('btn-arrange')?.click();
  await settle(300);
  const firstTile = d.querySelector('[data-object]');
  if (firstTile) { firstTile.click(); await settle(250); }
  d.querySelector('.arrange-more')?.setAttribute('open', '');
  await settle(250);
  sweep('arrange mode');

  ok('no element matches two routes in the same table', overlaps.length === 0,
    overlaps.length ? overlaps.slice(0, 6).join(' | ') : 'all routes disjoint');

  // --- and the tables are not trivially disjoint because they match nothing -----------------
  const wantInput = ['live field', 'resize slider'];
  const wantChange = ['structural field', 'current HP', 'rename tab', 'rename card', 'rename object'];
  for (const name of wantInput) {
    ok(`INPUT route "${name}" still matches something`, (routed.INPUT_ROUTES.get(name) || 0) > 0,
      `${routed.INPUT_ROUTES.get(name) || 0} element(s)`);
  }
  for (const name of wantChange) {
    ok(`CHANGE route "${name}" still matches something`, (routed.CHANGE_ROUTES.get(name) || 0) > 0,
      `${routed.CHANGE_ROUTES.get(name) || 0} element(s)`);
  }

  L.unshift(fails ? `${fails} FAILURE(S) — ${L.length} checks\n` : `ALL PASS — ${L.length} checks\n`);
  out.textContent = L.join('\n');
} catch (err) {
  out.textContent = `PROBE ERROR: ${err && err.stack || err}`;
}
</script>
