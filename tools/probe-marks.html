<!doctype html>
<!--
  The row marks: a spell's casting time, concentration and ritual flag, and an inventory item's
  attunement.

  tests.js covers the pure half — rules.castingTimeTag, rules.isConcentration (and that it agrees
  with the library's own flag on every spell), the template backfills, the load-path rule that
  reads `ritual` off "Action or Ritual" only when the key is absent, and spellToRow carrying the
  flag across. This covers what only a browser can answer:

    - the tag, the circled C and the circled R actually REACH the spell row, from seeded fields
      and from a row saved before either flag or `school` existed — the load path every existing
      player takes. The C is read off the duration and never stored, so an old row needs nothing;
    - C and R are circles in the accent colour, in the book's order (C, R, then the tag), and the
      casting-time R for a reaction is NOT a circle — the circle is the only thing telling a
      ritual's R from a reaction's;
    - the tags form a column (one right edge), and an EMPTY slot costs the name nothing: the
      margin trick in style.css is the whole reason a spell with no casting time keeps its width;
    - what a mark costs the name is exactly its own box and margin, and a long name ellipsizes
      rather than pushing the marks off a one-44px line — the widest slot (C, R and a tag)
      included. #154's 28-character name, a concentration spell, no longer reads in full at
      390px; the probe prints by how much as a NOTE, rather than asserting a promise the C broke;
    - ticking Ritual, retyping a duration and retyping a casting time are DERIVED changes — the
      marks move without rebuilding the section they happen in (#146), and all three are stored;
    - a stored `ritual: false` survives a reload against a casting time that still says
      "Ritual" — the key-present half of the backfill rule, end to end;
    - on the inventory, the attuned A shows only on attuned rows (with "Attuned" for a screen
      reader) and the quantities stay in ONE column whether a row carries the A or not, with no
      row wrapping — the fixed slot
      and the item's matching give-back are exactly the knife edge #137 measured. A long item
      name used to push its whole line past the row and the quantity 22px out of the column,
      attuned or not; this probe is what found it;
    - in Edit the A goes and an "Attuned" tick takes the note's line rather than adding one;
    - the print rules that hide both ticks and keep both marks are PARSED (the unbalanced-
      comment trap in CLAUDE.md).

  Run it like the others; it prints ALL PASS or the failures. It reseeds localStorage,
  including the layout keys, so it never inherits another run's arrangement.
-->
<meta charset="utf-8">
<title>row marks probe</title>
<style>
  body { font: 13px/1.6 ui-monospace, monospace; margin: 0; }
  #frame { width: 390px; height: 844px; border: 0; position: absolute; left: -9999px; }
  #out { white-space: pre-wrap; padding: 8px; }
</style>
<pre id="out">pending</pre>
<iframe id="frame" src="about:blank"></iframe>
<script type="module">
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const results = [];
const notes = [];   // printed under the verdict, never counted (see the #154 note in the spells half)
const ok =(name, cond, detail = '') => results.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? `   ${detail}` : ''}`);
// Equality form — see probe-spells.html for why a three-argument ok() is not an assertion.
const is = (name, actual, expected) => {
  const pass = Object.is(actual, expected);
  results.push(`${pass ? 'PASS' : 'FAIL'}  ${name}   got ${JSON.stringify(actual)}${pass ? '' : ` — expected ${JSON.stringify(expected)}`}`);
};
const eq = (name, actual, expected) => {
  const pass = JSON.stringify(actual) === JSON.stringify(expected);
  results.push(`${pass ? 'PASS' : 'FAIL'}  ${name}   got ${JSON.stringify(actual)}${pass ? '' : ` — expected ${JSON.stringify(expected)}`}`);
};

try {
  // Hold virtual time across the non-timer teardown (CLAUDE.md, the virtual-time trap).
  let spin = 0;
  const hold = setInterval(() => { for (let i = 0; i < 5e5; i++) spin = (spin * 31 + i) | 0; }, 10);
  if (navigator.serviceWorker) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map((r) => r.unregister()));
  }
  if (window.caches) {
    const keys = await caches.keys();
    await Promise.all(keys.map((k) => caches.delete(k)));
  }
  clearInterval(hold);

  const { STORAGE_KEY, SCHEMA_VERSION, blankCharacter, ROW_TEMPLATES } = await import('../js/constants.js');
  const spell = (over) => ({ ...ROW_TEMPLATES.spells(), prepared: true, ...over });

  const c = blankCharacter();
  c.name = 'Probe'; c.class = 'Wizard'; c.level = 5;
  c.abilities.int = 16;
  c.spellcasting.ability = 'int';
  // Everything above cantrips is ticked, so it all shows in play mode's collapsed levels.
  const identify = spell({ name: 'Identify', level: 1, castingTime: '1 minute or Ritual', duration: 'Instantaneous' });
  delete identify.ritual;   // a spell saved before the flag existed — the load path must mark it
  // Durations are the SRD's own, so the C lands exactly where it would on a picked spell.
  c.spellcasting.spells = [
    spell({ name: 'Fire Bolt', level: 0, prepared: false, castingTime: 'Action', duration: 'Instantaneous' }), // 0
    spell({ name: 'Shield', level: 1, castingTime: 'Reaction, which you take when you are hit by an attack roll', duration: '1 round' }), // 1
    spell({ name: 'Healing Word', level: 1, castingTime: 'Bonus Action', duration: 'Instantaneous' }), // 2
    spell({ name: 'Detect Magic', level: 1, castingTime: 'Action or Ritual', ritual: true, duration: 'Concentration, up to 10 minutes' }), // 3
    identify,                                                                                           // 4
    spell({ name: 'Homebrew Hex', level: 1, castingTime: '' }),                                         // 5
    spell({ name: 'Otiluke’s Irresistible Dance', level: 2, castingTime: 'Action', duration: 'Concentration, up to 1 minute' }), // 6
    // A row exactly as a save from before `ritual` and `school` stored it — none of the newer keys
    // at all. Both circles must come from the load path: R off the casting time, C off the
    // duration. C AND R AND a tag is also the widest slot a spell row has.
    { name: 'Detect Poison and Disease', level: 1, prepared: true, castingTime: 'Action or Ritual',
      range: 'Self', duration: 'Concentration, up to 10 minutes', components: 'V, S, M (a yew leaf)', notes: '' }, // 7
    // Hand-typed: the C is a whole word anywhere in the duration, not only the SRD's wording.
    spell({ name: 'Bless', level: 1, castingTime: '1 action', duration: 'conc. 1 min' }),             // 8
  ];
  c.inventory = [
    { item: 'Longsword', qty: 1, notes: '' },
    { item: 'Cloak of Protection', qty: 1, attuned: true, notes: '' },
    { item: 'Ring of Spell Storing (Shield and Misty Step)', qty: 1, attuned: true, notes: 'Holds up to five levels.' },
    { item: 'Potion of Healing', qty: 3, notes: '2d4+2' },
    // Long and NOT attuned: on main this pushed its line 22px past the row (fixed with this probe),
    // so the column check would pass on the attuned rows and still be false for this one.
    { item: 'Bag of Holding (rope, rations, torches and a crowbar)', qty: 1, notes: '' },
  ];
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    version: SCHEMA_VERSION, schemaVersion: SCHEMA_VERSION, activeId: c.id, characters: [c],
  }));
  localStorage.removeItem('dnd-character-sheets:layout');
  localStorage.removeItem('dnd-character-sheets:layout-default');

  const frame = document.getElementById('frame');
  const load = async (src) => {
    await new Promise((res) => { frame.onload = res; frame.src = src; });
    await wait(1200);
  };
  await load('../index.html');
  let d = frame.contentDocument;
  const stored = () => JSON.parse(localStorage.getItem(STORAGE_KEY)).characters[0];

  /* ------------------------------------------------------------------ spells, play mode */

  const card = () => d.getElementById('card-spells');
  const editBtn = () => card().querySelector('[data-action="toggle-card-edit"]');
  const rowNamed = (name) => [...d.querySelectorAll('#spells .row--spell')]
    .find((r) => r.querySelector('[data-bind$=".name"]').value === name);
  const castOf = (row) => row.querySelector('.row__cast');
  const tagOf = (row) => (castOf(row).hidden ? '' : row.querySelector('.row__castshort').textContent);
  const ritualShown = (row) => row.querySelector('.row__ritual').checkVisibility();
  const concShown = (row) => row.querySelector('.row__conc').checkVisibility();
  const rect = (el) => el.getBoundingClientRect();
  const ALL = ['Fire Bolt', 'Shield', 'Healing Word', 'Detect Magic', 'Identify', 'Homebrew Hex',
    'Otiluke’s Irresistible Dance', 'Detect Poison and Disease', 'Bless'];

  d.getElementById('tab-spells').click();
  await wait(300);

  eq('the casting-time tags reach the rows',
    ['Fire Bolt', 'Shield', 'Healing Word', 'Detect Magic', 'Identify', 'Otiluke’s Irresistible Dance', 'Detect Poison and Disease', 'Bless'].map((n) => tagOf(rowNamed(n))),
    ['A', 'R', 'BA', 'A', '1 min', 'A', 'A', 'A']);
  is('a screen reader hears the long form, not "R"', rowNamed('Shield').querySelector('.row__castlong').textContent, 'Reaction');
  is('...and the abbreviation is hidden from it', rowNamed('Shield').querySelector('.row__castshort').getAttribute('aria-hidden'), 'true');
  is('...and a hover title says it too', castOf(rowNamed('Healing Word')).title, 'Bonus action');
  ok('no casting time, no tag', castOf(rowNamed('Homebrew Hex')).hidden && !castOf(rowNamed('Homebrew Hex')).checkVisibility());

  eq('the circled R shows on rituals only', ALL.map((n) => ritualShown(rowNamed(n))),
    [false, false, false, true, true, false, false, true, false]);
  ok('a spell saved before the flag existed is marked from its casting time', ritualShown(rowNamed('Identify')));
  // The C is read off the duration on every render, so there is nothing to migrate: the row saved
  // before ANY of the newer keys gets it the same as a freshly picked spell.
  eq('the circled C shows exactly where the duration says Concentration', ALL.map((n) => concShown(rowNamed(n))),
    [false, false, false, true, false, false, true, true, true]);
  ok('a row saved before the newer keys existed shows both circles from the load path',
    concShown(rowNamed('Detect Poison and Disease')) && ritualShown(rowNamed('Detect Poison and Disease')));
  ok('...and nothing about the C is stored', !('concentration' in stored().spellcasting.spells[7]),
    JSON.stringify(Object.keys(stored().spellcasting.spells[7])));

  // What each circle says, and to whom.
  for (const [cls, word] of [['.row__conc', 'Concentration'], ['.row__ritual', 'Ritual']]) {
    const mark = rowNamed('Detect Magic').querySelector(cls);
    is(`${word}: the eye reads one capital`, mark.querySelector('[aria-hidden="true"]').textContent, word[0]);
    is(`${word}: a screen reader hears the word`, mark.querySelector('.visually-hidden').textContent, word);
    is(`${word}: so does a hover title`, mark.title, word);
    const cs = getComputedStyle(mark);
    ok(`${word}: drawn as a circle`, cs.borderRadius === '50%' && Math.abs(rect(mark).width - rect(mark).height) < 0.5
      && cs.borderTopStyle === 'solid' && parseFloat(cs.borderTopWidth) > 0,
      `${rect(mark).width.toFixed(1)}x${rect(mark).height.toFixed(1)} radius ${cs.borderRadius}`);
    is(`${word}: the ring is the letter's own colour`, cs.borderTopColor, cs.color);
    // Centred on the INK. Box-centring alone is always "centred" and left the capital ~1.1px high
    // (the line box keeps descender room a capital never uses), so the check is that the letter's
    // box has been trimmed to its cap height — shorter than its own font size, which an untrimmed
    // line-height:1 box never is — AND that the trimmed box sits in the middle of the ring.
    const letter = mark.querySelector('[aria-hidden="true"]');
    const lb = rect(letter), mb = rect(mark);
    const fontPx = parseFloat(getComputedStyle(letter).fontSize);
    ok(`${word}: the letter's box is trimmed to its cap height`, lb.height < fontPx * 0.85,
      `${lb.height.toFixed(2)}px tall at ${fontPx}px`);
    ok(`${word}: ...and centred in the ring`,
      Math.abs((lb.top + lb.bottom) / 2 - (mb.top + mb.bottom) / 2) < 0.5
        && Math.abs((lb.left + lb.right) / 2 - (mb.left + mb.right) / 2) < 0.5,
      `dy ${((lb.top + lb.bottom) / 2 - (mb.top + mb.bottom) / 2).toFixed(2)} dx ${((lb.left + lb.right) / 2 - (mb.left + mb.right) / 2).toFixed(2)}`);
    // The ring rides up to the tag's centre (style.css); the rule must survive a comment edit.
    ok(`${word}: the ring is lifted onto the tag's centre line`, cs.translate !== 'none' && cs.translate !== '',
      `translate ${cs.translate}`);
  }
  // "The app's colour theme": the accent token, resolved the same way the marks resolve it, so the
  // check follows the theme the run is in rather than pinning a hex.
  {
    const probe = d.createElement('span');
    probe.style.color = 'var(--accent)';
    d.body.append(probe);
    const accent = getComputedStyle(probe).color;
    probe.remove();
    eq('both circles are in the accent colour',
      ['.row__conc', '.row__ritual'].map((cls) => getComputedStyle(rowNamed('Detect Magic').querySelector(cls)).color),
      [accent, accent]);
  }
  ok('the casting-time R for a reaction is NOT a circle — that is the whole difference',
    getComputedStyle(castOf(rowNamed('Shield'))).borderTopStyle === 'none'
      && getComputedStyle(castOf(rowNamed('Shield'))).color !== getComputedStyle(rowNamed('Detect Magic').querySelector('.row__ritual')).color);
  {
    const row = rowNamed('Detect Poison and Disease');
    const xs = [row.querySelector('.row__conc'), row.querySelector('.row__ritual'), castOf(row)].map((el) => rect(el).left);
    ok('the book\'s order: C, then R, then the casting time', xs[0] < xs[1] && xs[1] < xs[2], JSON.stringify(xs.map(Math.round)));
  }

  const visibleSpells = () => [...d.querySelectorAll('#spells .row--spell')].filter((r) => r.checkVisibility());
  const rights = visibleSpells().map((r) => castOf(r)).filter((el) => el.checkVisibility()).map((el) => Math.round(rect(el).right));
  ok('the tags share one right edge, so they read as a column', rights.length >= 8 && new Set(rights).size === 1, JSON.stringify(rights));
  const heights = visibleSpells().map((r) => r.querySelector('.row__primary').offsetHeight);
  ok('every spell is still one 44px line, the widest slot included', heights.length >= 9 && heights.every((h) => h === 44), JSON.stringify(heights));
  ok('no line runs past its own row, however wide its slot',
    visibleSpells().every((r) => rect(r.querySelector('.row__primary')).right <= rect(r).right + 0.5));

  // The empty slot: the name must get every pixel the tick, the caret and the two gaps leave.
  {
    const row = rowNamed('Homebrew Hex');
    const primary = row.querySelector('.row__primary');
    const name = row.querySelector('[data-bind$=".name"]');
    const tick = row.querySelector('.row__prepared');
    const caret = row.querySelector('.row__expand');
    const gap = parseFloat(getComputedStyle(primary).columnGap);
    const expected = primary.clientWidth - rect(tick).width - rect(caret).width - 2 * gap;
    ok('an empty slot costs the name nothing', Math.abs(rect(name).width - expected) < 1,
      `name ${rect(name).width.toFixed(1)} of ${expected.toFixed(1)}`);
  }
  // What a circle costs the name: exactly its own box plus its margin, and nothing more. Measured
  // between two rows whose slots differ by the C alone (Fire Bolt's A, Bless's C + A), so the
  // comparison is the mark and not a guess at the font.
  const nameOf = (n) => rowNamed(n).querySelector('[data-bind$=".name"]');
  {
    const c = rowNamed('Bless').querySelector('.row__conc');
    const cost = rect(c).width + parseFloat(getComputedStyle(c).marginLeft);
    const lost = rect(nameOf('Fire Bolt')).width - rect(nameOf('Bless')).width;
    ok('a circle costs the name exactly its own box and margin', Math.abs(lost - cost) < 1,
      `lost ${lost.toFixed(1)}, circle + margin ${cost.toFixed(1)}`);
  }
  {
    // #154's 28-character fixture is a concentration spell, and at 390px the C is what it can no
    // longer afford: it ellipsizes by about two letters in play mode. Recorded, not asserted —
    // that is the trade the owner asked for, and an assertion that the name fits would be false.
    // What IS asserted is that it gives way by ellipsis and not by wrapping (the heights above).
    const name = nameOf('Otiluke’s Irresistible Dance');
    notes.push(`NOTE  "Otiluke's Irresistible Dance" (C + A) needs ${name.scrollWidth} in ${name.clientWidth} at ${frame.clientWidth}px`);
    const dp = nameOf('Detect Poison and Disease');
    notes.push(`NOTE  "Detect Poison and Disease" (C + R + A) needs ${dp.scrollWidth} in ${dp.clientWidth}`);
    ok('a cropped name ellipsizes rather than clipping mid-letter',
      getComputedStyle(name).textOverflow === 'ellipsis', getComputedStyle(name).textOverflow);
  }

  // Play mode never shows the Ritual tick — the circled R is the answer there.
  rowNamed('Detect Magic').querySelector('.row__expand').click();
  await wait(200);
  ok('play mode shows no Ritual tick, even on a ritual\'s open details',
    rowNamed('Detect Magic').classList.contains('is-expanded')
      && !rowNamed('Detect Magic').querySelector('.row__ritualpick').checkVisibility());
  rowNamed('Detect Magic').querySelector('.row__expand').click();

  /* ------------------------------------------------------------------ spells, Edit */

  editBtn().click();
  await wait(400);
  d.querySelector('#spells .spelllevel[data-level="1"] .spelllevel__summary').click();
  await wait(200);
  ok('Edit hides the slot, circles and all, where the ✕ needs the room',
    !rowNamed('Detect Magic').querySelector('.row__meta').checkVisibility()
      && !rowNamed('Detect Magic').querySelector('.row__conc').checkVisibility()
      && !rowNamed('Detect Magic').querySelector('.row__ritual').checkVisibility()
      && !rowNamed('Shield').querySelector('.row__meta').checkVisibility());

  rowNamed('Shield').querySelector('.row__expand').click();
  await wait(200);
  const pick = () => rowNamed('Shield').querySelector('.row__ritualpick');
  const box = () => pick().querySelector('input');
  ok('Edit offers the Ritual tick', pick().checkVisibility());
  ok('...unlocked', box().disabled === false);
  ok('...on a 44px target', rect(pick()).height >= 44, `${Math.round(rect(pick()).width)}x${Math.round(rect(pick()).height)}`);
  const shieldNode = rowNamed('Shield');
  box().click();
  await wait(600);   // past the 400ms storage debounce
  is('ticking it stores the flag', stored().spellcasting.spells[1].ritual, true);
  ok('...without rebuilding the section it was ticked in (a derived change, #146)',
    rowNamed('Shield') === shieldNode && shieldNode.classList.contains('is-expanded'));

  // Retype a casting time: the tag follows on the same pass.
  const hwNode = rowNamed('Healing Word');
  hwNode.querySelector('.row__expand').click();
  await wait(200);
  const hwTime = hwNode.querySelector('[data-bind$=".castingTime"]');
  hwTime.focus();
  d.execCommand('selectAll');                       // execCommand, not .value (CLAUDE.md)
  d.execCommand('insertText', false, '1 reaction');
  await wait(600);
  is('retyping the casting time stores it', stored().spellcasting.spells[2].castingTime, '1 reaction');
  is('...and the tag follows as you type', tagOf(hwNode), 'R');
  ok('...without rebuilding the row', rowNamed('Healing Word') === hwNode);

  // Retype a duration both ways: the C comes and goes on the same pass, and only the text is stored.
  const hwDur = hwNode.querySelector('[data-bind$=".duration"]');
  hwDur.focus();
  d.execCommand('selectAll');
  d.execCommand('insertText', false, 'Concentration, up to 1 minute');
  await wait(600);
  ok('typing "Concentration" into a duration puts the C on the row', hwNode.classList.contains('is-concentration'));
  ok('...without rebuilding it', rowNamed('Healing Word') === hwNode && hwNode.classList.contains('is-expanded'));
  is('...storing the text and nothing else', stored().spellcasting.spells[2].duration, 'Concentration, up to 1 minute');
  ok('...no concentration key', !('concentration' in stored().spellcasting.spells[2]));
  const blessNode = rowNamed('Bless');
  blessNode.querySelector('.row__expand').click();
  await wait(200);
  const blessDur = blessNode.querySelector('[data-bind$=".duration"]');
  blessDur.focus();
  d.execCommand('selectAll');
  d.execCommand('insertText', false, '1 minute');
  await wait(600);
  ok('taking it out takes the C off', !blessNode.classList.contains('is-concentration') && rowNamed('Bless') === blessNode);

  // Untick the backfilled one: a stored false must outlive "or Ritual" in its casting time.
  rowNamed('Identify').querySelector('.row__expand').click();
  await wait(200);
  rowNamed('Identify').querySelector('.row__ritualpick input').click();
  await wait(600);
  is('unticking a backfilled ritual stores false', stored().spellcasting.spells[4].ritual, false);

  editBtn().click();
  await wait(400);
  ok('back in play, a newly ticked ritual shows the circled R', ritualShown(rowNamed('Shield')));
  ok('...and an unticked one does not', !ritualShown(rowNamed('Identify')));
  ok('...a retyped duration shows its C', concShown(rowNamed('Healing Word')));
  ok('...and one with it taken out does not', !concShown(rowNamed('Bless')));

  await load('../index.html?reload=1');
  d = frame.contentDocument;
  d.getElementById('tab-spells').click();
  await wait(300);
  ok('after a reload, the stored false wins over a casting time that still says "Ritual"',
    !ritualShown(rowNamed('Identify')) && stored().spellcasting.spells[4].castingTime === '1 minute or Ritual');
  ok('...and the stored true is still true', ritualShown(rowNamed('Shield')));
  ok('...and every C is still read off its duration',
    concShown(rowNamed('Healing Word')) && concShown(rowNamed('Detect Poison and Disease')) && !concShown(rowNamed('Bless')));

  /* ------------------------------------------------------------------ inventory */

  const inv = () => d.querySelector('section[data-editcard="inventory"]');
  // The tab is read off where the card IS (#164's lesson), never assumed.
  d.getElementById(`tab-${inv().closest('.tabpanel').id.replace('panel-', '')}`).click();
  await wait(300);
  const invRows = () => [...d.querySelectorAll('#inventory .row--inventory')];
  const word = (row) => row.querySelector('.row__attuned');   // the A
  const qtyX = () => invRows().map((r) => Math.round(rect(r.querySelector('[data-bind$=".qty"]')).left));

  eq('the A shows on attuned items only', invRows().map((r) => word(r).checkVisibility()), [false, true, true, false, false]);
  is('it reads A on screen', word(invRows()[1]).querySelector('[aria-hidden="true"]').textContent, 'A');
  is('..."Attuned" to a screen reader', word(invRows()[1]).querySelector('.visually-hidden').textContent, 'Attuned');
  is('...and as a hover title', word(invRows()[1]).title, 'Attuned');
  ok('...in the accent colour, not the ink the quantity uses',
    getComputedStyle(word(invRows()[1])).color !== getComputedStyle(invRows()[1].querySelector('[data-bind$=".qty"]')).color,
    getComputedStyle(word(invRows()[1])).color);
  ok('the quantities stay in one column, attuned or not', new Set(qtyX()).size === 1, JSON.stringify(qtyX()));
  eq('every item is still one 44px line, the long attuned one included',
    invRows().map((r) => r.querySelector('.row__primary').offsetHeight), [44, 44, 44, 44, 44]);
  ok('no line is wider than its own row, however long the item',
    invRows().every((r) => rect(r.querySelector('.row__primary')).right <= rect(r).right),
    invRows().map((r) => `${Math.round(rect(r.querySelector('.row__primary')).right)}/${Math.round(rect(r).right)}`).join(' '));
  ok('the slot holds its A without cropping it',
    invRows().filter((r) => word(r).checkVisibility()).every((r) => word(r).scrollWidth <= word(r).clientWidth),
    invRows().map((r) => `${word(r).scrollWidth}/${word(r).clientWidth}`).join(' '));
  // Tap-to-reveal still works on a row carrying the word, tapping the word itself.
  word(invRows()[2]).click();
  await wait(200);
  ok('tapping the A still opens the note, like the rest of the row',
    invRows()[2].classList.contains('is-expanded') && invRows()[2].querySelector('.row__notes').checkVisibility());

  inv().querySelector('[data-action="toggle-card-edit"]').click();
  await wait(400);
  const picks = () => invRows().map((r) => r.querySelector('.row__attunepick'));
  ok('Edit swaps the A out', invRows().every((r) => !word(r).checkVisibility()));
  ok('...for an Attuned tick on every row', picks().every((p) => p.checkVisibility()));
  eq('...reflecting what is stored', picks().map((p) => p.querySelector('input').checked), [false, true, true, false, false]);
  ok('...unlocked', picks().every((p) => p.querySelector('input').disabled === false));
  ok('...on 44px targets', picks().every((p) => rect(p).height >= 44));
  ok('...sharing the note\'s line rather than adding one',
    invRows().every((r) => Math.abs(rect(r.querySelector('.row__attunepick')).top - rect(r.querySelector('.row__notes')).top) < 1),
    invRows().map((r) => `${Math.round(rect(r.querySelector('.row__attunepick')).top)}/${Math.round(rect(r.querySelector('.row__notes')).top)}`).join(' '));
  picks()[0].querySelector('input').click();
  await wait(600);
  is('ticking Attuned stores it', stored().inventory[0].attuned, true);
  inv().querySelector('[data-action="toggle-card-edit"]').click();
  await wait(400);
  ok('back in play the newly attuned item shows the A', word(invRows()[0]).checkVisibility());
  ok('...and the quantities are still one column', new Set(qtyX()).size === 1, JSON.stringify(qtyX()));

  /* ------------------------------------------------------------------ print, parsed */

  const printRules = [...d.styleSheets]
    .flatMap((sheet) => { try { return [...sheet.cssRules]; } catch { return []; } })
    .filter((rule) => rule.media && [...rule.media].includes('print'))
    .flatMap((rule) => [...rule.cssRules]);
  const findRule = (part) => printRules.find((rule) => rule.selectorText && rule.selectorText.includes(part));
  const hideTicks = findRule('.row__ritualpick');
  ok('a print rule hides both ticks', Boolean(hideTicks) && hideTicks.selectorText.includes('.row__attunepick'),
    `${printRules.length} print rules parsed`);
  is('...as display:none !important', hideTicks && `${hideTicks.style.display} ${hideTicks.style.getPropertyPriority('display')}`, 'none important');
  ok('a print rule keeps the spell marks from a card left in Edit', Boolean(findRule('.is-editing .row__meta')));
  ok('...and the attuned A', Boolean(findRule('.is-editing .row--inventory.is-attuned .row__attuned')));

  ok('the document does not scroll sideways at 390px',
    d.documentElement.scrollWidth <= 390, `scrollWidth ${d.documentElement.scrollWidth}`);

  const failed = results.filter((r) => r.startsWith('FAIL')).length;
  out.textContent = `${failed === 0 ? 'ALL PASS' : `${failed} FAILURE(S)`} — ${results.length} checks\n${notes.join('\n')}\n\n${results.join('\n')}`;
} catch (err) {
  out.textContent = `ERROR ${err && err.stack || err}\n\n${results.join('\n')}`;
}
</script>
