<!doctype html>
<!--
  Laptop columns: which tabs stand in which column at >=900px, and the arrange controls that set
  them.

  tests.js holds the model — reconciliation, the two mutators, the fold. What only a browser can
  show is the reason the feature exists. A laptop used to pour every card into one balanced CSS
  `column-count` flow, which cut a column wherever the heights evened out and RE-cut it whenever a
  card changed height: opening two spells' details sent Identity to the next column and dropped
  every card there ~470px, under the player's pointer. So the first claim here is that growing a
  card moves NOTHING in any other column, measured to the pixel.

  Then the rest of what the pure suite cannot see:
   - the columns reach the screen (one `.deskcol` per column, each tab's cards in it, every panel
     shown, no tab bar), and the group label appears over two or more cards only;
   - a window narrower than the layout folds it — three columns in two stack the second and the
     third — and a resize across a breakpoint re-cuts it, both ways;
   - arrange mode at a laptop width shows the laptop, not the phone's one tab: every column's
     label carries ← → ↑ ↓, they are 44px and are what a tap there hits, they move the panel,
     focus comes back to the button, the move announces itself, persists, and is one Undo step;
   - → never opens a column the window has no room to show, and does once the window is wider;
   - a phone never sees any of it.

  The iframe is resized between scenes; the app re-cuts its columns on a matchMedia change, which
  is exactly what a player dragging a window edge does.

  Run it the same way as probe.html; prints ALL PASS or the failing checks.
-->
<meta charset="utf-8">
<title>laptop columns probe</title>
<style>
  body { font: 13px/1.6 ui-monospace, monospace; margin: 0; }
  #frame { width: 1440px; height: 900px; border: 0; position: absolute; left: -9999px; }
  #out { white-space: pre-wrap; padding: 8px; }
</style>
<pre id="out">pending</pre>
<iframe id="frame" src="about:blank"></iframe>
<script type="module">
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const results = [];
const ok = (name, cond, detail = '') => results.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? `   ${detail}` : ''}`);

try {
  // These awaits are not timers, so under --virtual-time-budget nothing stops virtual time leaping
  // to the budget mid-teardown — the page is dumped reading `pending`. A ticking interval stops the
  // leap; the busy work in each tick makes the budget last seconds of real time, not ~0.15s.
  let spin = 0;
  const hold = setInterval(() => { for (let i = 0; i < 5e5; i++) spin = (spin * 31 + i) | 0; }, 10);
  if (navigator.serviceWorker) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map((r) => r.unregister()));
  }
  if (window.caches) {
    const keys = await caches.keys();
    await Promise.all(keys.map((k) => caches.delete(k)));
  }
  clearInterval(hold);

  const { STORAGE_KEY, SCHEMA_VERSION, blankCharacter, ROW_TEMPLATES } = await import('../js/constants.js');
  const LAYOUT_KEY = 'dnd-character-sheets:layout';
  const LAYOUT_DEFAULT_KEY = 'dnd-character-sheets:layout-default';

  // A level-9 caster with enough on every card that the columns have real heights to keep, and
  // spells with notes to open — the gesture that used to re-cut the columns.
  const c = blankCharacter();
  c.name = 'Seraphine'; c.class = 'Sorcerer'; c.level = 9;
  c.abilities.cha = 18;
  c.spellcasting.ability = 'cha';
  const longNote = 'A bright streak flashes from your pointing finger to a point you choose within range '
    + 'and then blossoms with a low roar into an explosion of flame. Each creature in a 20-foot-radius '
    + 'sphere centred on that point makes a Dexterity saving throw.';
  const spell = (name, level, prepared = false) => ({
    ...ROW_TEMPLATES.spells(), name, level, prepared, castingTime: 'Action', duration: 'Instantaneous', notes: longNote,
  });
  c.spellcasting.spells = [
    ...['Guidance', 'Light', 'Mage Hand', 'Sacred Flame'].map((n) => spell(n, 0)),
    ...['Shield', 'Magic Missile', 'Healing Word'].map((n) => spell(n, 1, true)),
    ...['Fireball', 'Counterspell'].map((n) => spell(n, 3, true)),
  ];
  c.features = ['Celestial Resistance', 'Darkvision', 'Healing Hands', 'Font of Magic', 'Metamagic']
    .map((name) => ({ ...ROW_TEMPLATES.features(), name, text: 'Some rules text.' }));
  c.inventory = ['Dagger', 'Arcane focus', 'Potion of Healing'].map((item) => ({ ...ROW_TEMPLATES.inventory(), item }));
  c.attacks = [{ ...ROW_TEMPLATES.attacks(), name: 'Dagger' }];
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    version: SCHEMA_VERSION, schemaVersion: SCHEMA_VERSION, activeId: c.id, characters: [c],
  }));
  localStorage.removeItem(LAYOUT_KEY);
  localStorage.removeItem(LAYOUT_DEFAULT_KEY);

  const frame = document.getElementById('frame');
  const setWidth = async (px) => { frame.style.width = `${px}px`; await wait(400); };
  await new Promise((res) => { frame.onload = res; frame.src = '../index.html'; });
  await wait(1200);
  const d = frame.contentDocument;
  const W = frame.contentWindow;

  const cols = () => [...d.querySelectorAll('.cards > .deskcol')];
  const layoutOf = () => cols().map((col) => [...col.children].map((p) => p.id.replace('panel-', '')));
  const shape = () => JSON.stringify(layoutOf());
  const card = (id) => d.querySelector(`[data-editcard="${id}"]`);
  const rectOf = (el) => { const r = el.getBoundingClientRect(); return { x: Math.round(r.left), y: Math.round(r.top + W.scrollY), h: Math.round(r.height) }; };
  const shown = (el) => Boolean(el) && el.checkVisibility();
  const head = (tab) => d.querySelector(`#panel-${tab} > .tabpanel__head`);
  const btn = (tab, way) => d.querySelector(`.tabpanel__move[data-tab="${tab}"] [data-action="desk-col-${way}"]`);
  const status = () => d.getElementById('arrange-status').textContent;
  const stored = () => { try { return JSON.parse(localStorage.getItem(LAYOUT_KEY)).desktop.columns; } catch { return null; } };

  /* ---------------------------------------------------- 1. the columns reach the screen */
  const DEFAULT = '[["combat","gear","abilities"],["spells"],["character"]]';
  ok('1440px: three columns, the default tabs in each', shape() === DEFAULT, shape());
  ok('every panel shown', ['combat', 'gear', 'abilities', 'spells', 'character'].every((t) => shown(d.getElementById(`panel-${t}`))));
  ok('no tab bar on a laptop', W.getComputedStyle(d.getElementById('tabbar')).display === 'none');
  const xs = cols().map((col) => Math.round(col.getBoundingClientRect().left));
  ok('the columns stand side by side', xs[0] < xs[1] && xs[1] < xs[2], xs.join(' < '));
  ok('a tab\'s cards share their column\'s left edge',
    ['spellcasting', 'spellslots', 'spells'].every((id) => rectOf(card(id)).x === rectOf(card('spellcasting')).x)
    && ['identity', 'proficiencies', 'features', 'inventory', 'notes'].every((id) => rectOf(card(id)).x === rectOf(card('identity')).x));
  ok('Attacks sits directly under Status', rectOf(card('attacks')).y > rectOf(card('combat')).y
    && rectOf(card('attacks')).x === rectOf(card('combat')).x);
  ok('a group label over two or more cards (Spells, Character)', shown(head('spells')) && shown(head('character')));
  ok('…and none over one card, which names itself (Status, Attacks, Abilities)',
    !shown(head('combat')) && !shown(head('gear')) && !shown(head('abilities')));
  // Null-safe from here to §2 so the stability check below still runs — and still says so — on a
  // build without the label at all. That is how it was confirmed to fail on the old flow.
  ok('the label says the tab\'s name', head('spells')?.textContent.trim().toLowerCase() === 'spells', head('spells')?.textContent);
  ok('…and is aria-hidden (the panel is already named by its tab)',
    head('spells')?.querySelector('.tabpanel__label')?.getAttribute('aria-hidden') === 'true');

  /* ------------------------------------ 2. a growing card moves nothing in another column */
  const others = ['combat', 'attacks', 'abilities', 'identity', 'proficiencies', 'features', 'inventory', 'notes'];
  const before = Object.fromEntries([...others, 'spellcasting', 'spellslots', 'spells'].map((id) => [id, rectOf(card(id))]));
  const expanders = [...d.querySelectorAll('#spells .row--spell .row__expand')].filter(shown).slice(0, 3);
  ok('three spells to open', expanders.length === 3, `${expanders.length}`);
  for (const b of expanders) b.click();
  await wait(300);
  const grew = rectOf(card('spells')).h - before.spells.h;
  ok('opening three spells grew the Spells card', grew > 100, `+${grew}px`);
  const moved = others.filter((id) => JSON.stringify(rectOf(card(id))) !== JSON.stringify(before[id]));
  ok('…and moved NO card in any other column, by a pixel', moved.length === 0, moved.map((id) => `${id} ${JSON.stringify(before[id])}→${JSON.stringify(rectOf(card(id)))}`).join('; '));
  ok('…nor the cards above it in its own column',
    ['spellcasting', 'spellslots'].every((id) => JSON.stringify(rectOf(card(id))) === JSON.stringify(before[id])));
  for (const b of expanders) b.click(); // close them again
  await wait(200);

  /* ------------------------------------------------------- 3. the fold, and re-cutting */
  await setWidth(1000);
  ok('1000px (room for two): the second and third columns stack', shape() === '[["combat","gear","abilities"],["spells","character"]]', shape());
  ok('…Character under Spells, not beside it',
    rectOf(card('identity')).x === rectOf(card('spellcasting')).x && rectOf(card('identity')).y > rectOf(card('spells')).y);
  await setWidth(1700);
  ok('1700px (room for four): still the layout\'s own three, just wider', shape() === DEFAULT, shape());
  await setWidth(1440);
  ok('back to 1440px: three again', shape() === DEFAULT, shape());

  /* ------------------------------------------------------------ 4. arranging the columns */
  d.getElementById('btn-arrange').click();
  await wait(300);
  ok('arrange at 1440px keeps the laptop view: every panel shown',
    ['combat', 'gear', 'abilities', 'spells', 'character'].every((t) => shown(d.getElementById(`panel-${t}`))));
  ok('…and no phone tab bar', W.getComputedStyle(d.getElementById('tabbar')).display === 'none');
  ok('every tab shows its label while arranging, one card or five',
    ['combat', 'gear', 'abilities', 'spells', 'character'].every((t) => shown(head(t))));
  const where = (t) => d.querySelector(`.tabpanel__move[data-tab="${t}"] .tabpanel__where`).textContent;
  ok('the label reads where the tab stands', where('gear') === 'Column 1 of 3' && where('character') === 'Column 3 of 3',
    `${where('gear')} / ${where('character')}`);

  // Every column control is 44px and is what a tap on it hits (#115's lesson: size is not reach).
  const small = [];
  const covered = [];
  for (const b of d.querySelectorAll('.tabpanel__move button')) {
    b.scrollIntoView({ block: 'center' });
    const r = b.getBoundingClientRect();
    if (r.width < 44 || r.height < 44) small.push(`${b.getAttribute('aria-label')} ${Math.round(r.width)}x${Math.round(r.height)}`);
    const hit = d.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    if (hit !== b) covered.push(`${b.getAttribute('aria-label')} → ${hit ? hit.className || hit.tagName : 'nothing'}`);
  }
  ok('every column control is at least 44px', small.length === 0, small.join('; '));
  ok('every column control is what a tap there hits', covered.length === 0, covered.join('; '));

  ok('Spells, alone in its column: no ↑ or ↓', btn('spells', 'up').disabled && btn('spells', 'down').disabled);
  ok('Character, alone at the right edge: no →', btn('character', 'right').disabled);
  ok('Abilities ← would open a fourth column the window cannot show: disabled', btn('abilities', 'left').disabled,
    btn('abilities', 'left').getAttribute('aria-label'));
  ok('Status ↑ at the top of its column: disabled', btn('combat', 'up').disabled);

  btn('gear', 'right').click();
  await wait(250);
  ok('Attacks →: into the Spells column, at its own height', shape() === '[["combat","abilities"],["spells","gear"],["character"]]', shape());
  ok('…the card is really there', rectOf(card('attacks')).x === rectOf(card('spellcasting')).x);
  ok('…focus is back on the button that was pressed', d.activeElement === btn('gear', 'right'),
    d.activeElement && (d.activeElement.getAttribute('aria-label') || d.activeElement.tagName));
  ok('…it announces where the tab went', status() === 'Moved Attacks to column 2 of 3.', status());
  ok('…and Undo is live', !d.querySelector('[data-action="layout-undo"]').disabled);
  await wait(600); // the layout write is debounced 400ms
  ok('…and it is saved', JSON.stringify(stored()) === '[["combat","abilities"],["spells","gear"],["character"]]', JSON.stringify(stored()));

  btn('gear', 'up').click();
  await wait(250);
  ok('Attacks ↑: above Spells', shape() === '[["combat","abilities"],["gear","spells"],["character"]]', shape());
  ok('…focus falls to ↓ when ↑ hits the top', d.activeElement === btn('gear', 'down'),
    d.activeElement && (d.activeElement.getAttribute('aria-label') || d.activeElement.tagName));

  d.querySelector('[data-action="layout-undo"]').click();
  await wait(150);
  d.querySelector('[data-action="layout-undo"]').click();
  await wait(250);
  ok('two Undos: the default columns again', shape() === DEFAULT, shape());

  // A wider window has room for a fourth column, and → / ← may open one there.
  await setWidth(1700);
  ok('1700px: Abilities ← is live now (room for four)', !btn('abilities', 'left').disabled);
  btn('abilities', 'left').click();
  await wait(250);
  ok('…and opens a column on the left', shape() === '[["abilities"],["combat","gear"],["spells"],["character"]]', shape());
  ok('…four columns side by side', cols().length === 4);
  await setWidth(1440);
  ok('the same four at 1440px fold: the third and fourth stack',
    shape() === '[["abilities"],["combat","gear"],["spells","character"]]', shape());
  ok('…and the labels still read the layout\'s own column', where('character') === 'Column 4 of 4', where('character'));
  d.querySelector('[data-action="layout-undo"]').click();
  await wait(250);
  ok('Undo: back to three', shape() === DEFAULT, shape());

  d.querySelector('#arrange-bar [data-action="arrange-toggle"]').click();
  await wait(250);
  ok('Done takes the column controls away', d.querySelectorAll('.tabpanel__move').length === 0);
  ok('…and the single-card labels with them', !shown(head('combat')) && shown(head('spells')));

  /* ------------------------------------------- 5. a non-caster: the label follows the cards */
  const ability = d.getElementById('f-spell-ability');
  ability.value = '';
  ability.dispatchEvent(new Event('change', { bubbles: true }));
  await wait(300);
  ok('a non-caster\'s Spells tab is one card, so no label', !shown(head('spells')),
    `${[...d.querySelectorAll('#panel-spells > [data-editcard]')].filter(shown).length} cards shown`);
  ability.value = 'cha';
  ability.dispatchEvent(new Event('change', { bubbles: true }));
  await wait(300);
  ok('…and back with the cards', shown(head('spells')));

  /* ------------------------------------------------------------- 6. a phone sees none of it */
  await setWidth(390);
  const panelsShown = ['combat', 'gear', 'abilities', 'spells', 'character'].filter((t) => shown(d.getElementById(`panel-${t}`)));
  ok('390px: one panel at a time', panelsShown.length === 1, panelsShown.join(','));
  ok('…the tab bar is back', W.getComputedStyle(d.getElementById('tabbar')).display !== 'none');
  ok('…the column wrappers dissolve', W.getComputedStyle(cols()[0]).display === 'contents');
  ok('…and no group label is drawn', ['combat', 'spells', 'character'].every((t) => !shown(head(t))));
  d.getElementById('tab-spells').click();
  await wait(200);
  ok('…and the tabs still switch', shown(d.getElementById('panel-spells')) && !shown(d.getElementById('panel-combat')));
} catch (err) {
  results.push(`FAIL  probe crashed: ${err && err.stack || err}`);
}

const failures = results.filter((r) => r.startsWith('FAIL'));
out.textContent = (failures.length ? `${failures.length} FAILED\n\n` : 'ALL PASS\n\n') + results.join('\n');
</script>
