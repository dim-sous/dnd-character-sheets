<!doctype html>
<!--
  TEMPORARY functional check (#71/#72/#73). The data layer is covered by tests.js; what is new
  and untested here is the DOM wiring — a tap on a TILE now selects it, and the toolbar acts on
  whatever is selected rather than on the tile it sits inside. Delete once the redesign lands.
-->
<meta charset="utf-8">
<title>arrange fn probe</title>
<style>
  body { font: 13px/1.6 ui-monospace, monospace; margin: 0; }
  #frame { width: 390px; height: 844px; border: 0; position: absolute; left: -9999px; }
  #out { white-space: pre-wrap; padding: 8px; }
</style>
<pre id="out">pending</pre>
<iframe id="frame" src="about:blank"></iframe>
<script type="module">
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const results = [];
const ok = (name, cond, detail = '') => results.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? `   ${detail}` : ''}`);

try {
  if (navigator.serviceWorker) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map((r) => r.unregister()));
  }
  if (window.caches) {
    const keys = await caches.keys();
    await Promise.all(keys.map((k) => caches.delete(k)));
  }

  const { STORAGE_KEY, SCHEMA_VERSION, blankCharacter } = await import('../js/constants.js');
  const c = blankCharacter();
  // Wounded on purpose, not at full HP: a long rest restores LOST hit points, so a character
  // seeded at max would absorb the #115 check below without changing a single visible number.
  c.name = 'Probe'; c.class = 'Wizard'; c.level = 5; c.hp.max = 32; c.hp.current = 20;
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    version: SCHEMA_VERSION, schemaVersion: SCHEMA_VERSION, activeId: c.id, characters: [c],
  }));
  // Colons, not hyphens (layout-view.js) — and both keys, or a run inherits the previous run's
  // reordering and the assertions below drift with it.
  localStorage.removeItem('dnd-character-sheets:layout');
  localStorage.removeItem('dnd-character-sheets:layout-default');

  const frame = document.getElementById('frame');
  await new Promise((res) => { frame.onload = res; frame.src = '../index.html'; });
  await wait(1200);
  const d = frame.contentDocument;

  const ids = () => [...d.querySelectorAll('#panel-combat [data-object]')].map((n) => n.dataset.object);
  const bar = () => d.getElementById('objbar');
  const btn = (a) => bar().querySelector(`[data-action="${a}"]`);

  d.querySelector('[data-action="arrange-toggle"]').click();
  await wait(350);

  ok('arrange mode is on', d.body.classList.contains('is-arranging'));
  ok('hint shown before any selection', /Tap a tile/.test(bar().textContent), `"${bar().textContent.trim()}"`);
  ok('no toolbar buttons yet', bar().querySelectorAll('button').length === 0);

  /*
   * Size budget (#73: "entering arrange mode for one small change doesn't reformat the whole
   * app"). The bar shipped at 388px of an 844px screen — 46% — because the tab-editing list sat
   * open permanently, leaving 2 of 12 Combat tiles visible. These ceilings are what stops it
   * growing back; they are deliberately a little above the measured 143 / 219 so ordinary
   * wording changes don't trip them, and far below where it came from.
   */
  const barH = () => d.getElementById('arrange-bar').getBoundingClientRect().height;
  const vh = frame.contentWindow.innerHeight;
  const topH = d.querySelector('.topbar').getBoundingClientRect().height;
  const tabsH = d.querySelector('.tabbar').getBoundingClientRect().height;
  const tiles = () => [...d.querySelectorAll('#panel-combat [data-object]')];
  const visibleTiles = () => tiles().filter((n) => {
    const r = n.getBoundingClientRect();
    return r.top < vh - tabsH && r.bottom > barH() + topH;
  }).length;
  ok('bar is small with nothing selected', barH() <= 160,
    `${Math.round(barH())}px of ${vh} (budget 160), ${visibleTiles()} of ${tiles().length} tiles visible`);

  // --- selection -----------------------------------------------------------------------
  const order0 = ids();
  const second = d.querySelector(`#panel-combat [data-object="${order0[1]}"]`);
  second.click();
  await wait(250);
  ok('tapping a tile selects it', second.classList.contains('is-selected'));
  ok('selected tile reports aria-pressed', second.getAttribute('aria-pressed') === 'true');
  ok('exactly one tile is selected', d.querySelectorAll('#panel-combat [data-object].is-selected').length === 1);
  ok('toolbar names the selection', bar().querySelector('.obj-rename').value.length > 0,
    `"${bar().querySelector('.obj-rename').value}"`);
  ok('position readout is visible text', /2 of \d+/.test(bar().querySelector('.objbar__pos').textContent),
    `"${bar().querySelector('.objbar__pos').textContent}"`);
  ok('the width readout is visible, not just an aria-label',
    /wide|width|third|quarter|sixth/i.test(bar().querySelector('.objbar__size').textContent),
    `"${bar().querySelector('.objbar__size').textContent.trim()}"`);
  /*
   * Raised from 230 to 285 for the two size sliders (item 1), and the cost is real rather than
   * rounding: the bar goes 219 → 269, and the visible-tile count below drops from 4 to 3. It was
   * paid for as far as it could be — the rename field gave up the row it had to itself — and the
   * remainder buys ~165px of travel per slider. On one shared row the bar would stay at 219 and
   * each track would be ~96px, which is 9px per stop: present, unusable, and the exact failure
   * mode of the 22px in-tile cluster #72 deleted.
   *
   * The tile count is the check that matters and it has NOT been relaxed. If a later change
   * takes it to 2, that is the shipped-build number this whole mode was rebuilt to escape.
   */
  ok('bar stays small with a tile selected', barH() <= 285, `${Math.round(barH())}px of ${vh} (budget 285)`);
  // The symptom the bar's height causes, kept as its own check because it is what a player
  // actually notices. Coupled to the DEFAULT Combat layout (Hit Points is full-width and first),
  // so #75-style reordering can move it legitimately — the height budgets are the stable guard.
  // Shipped build: 2 of 12.
  ok('at least 3 tiles remain visible while arranging', visibleTiles() >= 3,
    `${visibleTiles()} of ${tiles().length}`);

  // --- the toolbar acts on the SELECTION, not on where it sits ------------------------
  // The ↑/↓ nudge is gone (#73) — "Move to…" is the single move gesture now, and the placement
  // flow itself is covered end to end by probe-arrange-place.html.
  ok('no ↑/↓ nudge left in the toolbar',
    !btn('move-object-up') && !btn('move-object-down'));
  btn('place-object-start').click();
  await wait(300);
  d.querySelectorAll('.dropslot')[0].click();       // gap 0 = before the first object
  await wait(300);
  ok('Move to… moves the selected tile', ids()[0] === order0[1], `${order0.slice(0, 2)} -> ${ids().slice(0, 2)}`);
  ok('the moved tile stays selected',
    d.querySelector(`#panel-combat [data-object="${order0[1]}"]`).classList.contains('is-selected'));

  /*
   * The size sliders (item 1). The old control was a button cycling 1× → 2× → full; there are
   * eleven widths and thirteen heights now, so it is a pair of ranges. Driven the way a finger
   * drives them — set .value, fire `input` — because that is the event the layout listens on,
   * and a `change`-only test would pass while the tile refused to follow the thumb.
   */
  const range = (action) => bar().querySelector(`input[data-action="${action}"]`);
  const drag = async (action, value) => {
    const el = range(action);
    el.value = String(value);
    el.dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true }));
    await wait(250);
  };
  const tile = () => d.querySelector(`#panel-combat [data-object="${order0[1]}"]`);

  ok('the width control is a range, not a cycle button',
    Boolean(range('resize-object')) && !bar().querySelector('button[data-action="resize-object"]'));
  ok('width spans the whole grid', range('resize-object').min === '2' && range('resize-object').max === '12',
    `${range('resize-object').min}..${range('resize-object').max}`);
  ok('there is a height range too', Boolean(range('resize-object-height')));

  await drag('resize-object', 5);
  ok('an in-between width reaches the tile', tile().style.gridColumn === 'span 5',
    `gridColumn "${tile().style.gridColumn}"`);
  ok('the readout says what it means, not just the number',
    /5\/12/.test(range('resize-object').parentElement.textContent),
    `"${range('resize-object').parentElement.textContent.trim()}"`);
  await drag('resize-object', 6);
  ok('a named fraction reads as its name',
    /half/i.test(range('resize-object').parentElement.textContent),
    `"${range('resize-object').parentElement.textContent.trim()}"`);

  // Height is an explicit size written as a custom property, and the slider opens at whatever
  // the tile already is so it can be dragged shorter as well as taller. probe-tile-size.html
  // covers both directions; this is the wiring check.
  const heightBefore = tile().getBoundingClientRect().height;
  await drag('resize-object-height', Number(range('resize-object-height').max));
  ok('height reaches the tile as --tile-h', /var\(--tile-step\)/.test(tile().style.getPropertyValue('--tile-h')),
    `"${tile().style.getPropertyValue('--tile-h')}"`);
  ok('and the tile actually grows', tile().getBoundingClientRect().height > heightBefore + 20,
    `${Math.round(heightBefore)} -> ${Math.round(tile().getBoundingClientRect().height)}`);
  await drag('resize-object-height', Number(range('resize-object-height').min));
  ok('and shrinks below its natural height', tile().getBoundingClientRect().height < heightBefore,
    `${Math.round(heightBefore)} -> ${Math.round(tile().getBoundingClientRect().height)}`);

  // One undo step for a whole drag, not one per pixel of travel: the stack snapshots only when
  // the value first leaves where the gesture started.
  const undoBtn = () => d.querySelector('[data-action="layout-undo"]');
  for (const v of [7, 8, 9, 10]) await drag('resize-object', v);
  undoBtn().click();
  await wait(300);
  ok('undo steps back past the whole drag, not one stop of it',
    tile().style.gridColumn === 'span 6', `gridColumn "${tile().style.gridColumn}"`);
  await drag('resize-object', 6);

  btn('toggle-object-hide').click();
  await wait(250);
  ok('Hide flips to Show', btn('toggle-object-hide').textContent === 'Show');
  btn('toggle-object-hide').click();
  await wait(250);
  ok('Show flips back to Hide', btn('toggle-object-hide').textContent === 'Hide');

  // --- rename via the bar renames the SELECTED tile ------------------------------------
  const rename = bar().querySelector('.obj-rename');
  rename.focus();
  d.execCommand('selectAll');
  d.execCommand('insertText', false, 'Wounds');
  rename.dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
  await wait(300);
  const renamed = d.querySelector(`#panel-combat [data-object="${order0[1]}"]`);
  ok('rename reaches the selected tile', /Wounds/i.test(renamed.textContent),
    `label now "${renamed.querySelector('.tile__label, .subhead')?.textContent.trim()}"`);

  // --- the disclosure and the rest of the app still work -------------------------------
  const more = d.querySelector('.arrange-more');
  ok('disclosure starts closed', !more.open);
  more.querySelector('summary').click();
  await wait(250);
  ok('summary opens the disclosure', more.open);
  ok('tab rows live inside it', d.querySelectorAll('.arrange-more .tabrow').length > 0,
    `${d.querySelectorAll('.arrange-more .tabrow').length} rows`);
  ok('Set as default moved in with them', Boolean(d.querySelector('.arrange-more [data-action="arrange-set-default"]')));
  ok('opening it did not change the selection',
    d.querySelector(`#panel-combat [data-object="${order0[1]}"]`).classList.contains('is-selected'));

  // Tab switching must survive the click interception — this broke once already.
  const spellsTab = d.getElementById('tab-spells');   // tabs key off id + aria-controls, not data-tab
  ok('the spells tab exists to click', Boolean(spellsTab));
  spellsTab.click();
  await wait(300);
  ok('tab bar still switches while arranging',
    d.getElementById('panel-spells').hidden === false,
    `spells hidden=${d.getElementById('panel-spells').hidden}`);
  d.getElementById('tab-combat').click();
  await wait(250);

  d.querySelector('.arrange-bar [data-action="arrange-toggle"]').click();
  await wait(300);
  ok('Done exits arrange mode', !d.body.classList.contains('is-arranging'));
  ok('tiles lose their button role on exit',
    [...d.querySelectorAll('[data-object]')].every((n) => !n.hasAttribute('role')));
  ok('disclosure folds back up for next time', !d.querySelector('.arrange-more').open);

  // Re-entry must show the hint again, not a blank row.
  d.querySelector('#btn-arrange').click();
  await wait(350);
  ok('re-entry shows the hint again', /Tap a tile/.test(bar().textContent), `"${bar().textContent.trim()}"`);

  /*
   * #115: a character action inside a tile must not fire while arranging.
   *
   * Last, because it needs a clean slate — nothing selected — and it is the one check here that
   * would mutate character data if it failed. The Rest tile carries `data-action="long-rest"`,
   * and dispatch used to run before tile selection, so tapping that tile to MOVE it instead
   * offered to reset HP, Hit Point Dice, death saves, concentration, exhaustion and every spell
   * slot. The CSS that hides `.card__edit` and `add-row` during arrange never listed this one,
   * and it could not have helped anyway: `pointer-events` is inherited, so the tile's own opt-in
   * carries down to every button inside it.
   *
   * The button itself is clicked, not the tile's padding — the worst case, and the exact gesture
   * a player makes when the tile they want to move is mostly button.
   */
  const restTile = d.querySelector('#panel-combat [data-object="rest"]');
  const restBtn = restTile && restTile.querySelector('[data-action="long-rest"]');
  ok('the Rest tile still contains the Long rest action', Boolean(restBtn));
  // Counted rather than blocked: `confirm` returning true is what makes the HP assertion below
  // meaningful, so a regression fails loudly on both counts instead of being swallowed here.
  let confirms = 0;
  frame.contentWindow.confirm = () => { confirms++; return true; };
  const hpBefore = d.getElementById('f-hp-current').value;
  restBtn.click();
  await wait(300);
  ok('tapping Long rest while arranging does not fire it', confirms === 0, `${confirms} confirm(s)`);
  ok('it selects the tile instead', restTile.classList.contains('is-selected'));
  ok('and hit points are untouched', d.getElementById('f-hp-current').value === hpBefore,
    `${hpBefore} -> ${d.getElementById('f-hp-current').value}`);

  /*
   * The same hole one layer BELOW the ACTIONS map, found on the Conditions tile.
   *
   * Some controls need no [data-action] at all, because the browser already knows what to do with
   * them. Conditions is a <details> wrapping the condition chips, so tapping the tile to move it
   * folded it open and shut instead — and once open, a tap that landed on a chip gave the
   * character a condition. Blinded, acquired while rearranging furniture, with no undo for
   * character data (#107). Same inheritance story as #115: the card is pointer-inert while
   * arranging, [data-object] opts back in so a tap can select a tile, and the whole subtree comes
   * with it.
   *
   * Four checks, because there are three ways in and each needs its own guard — the pointer (the
   * tile's descendants are pointer-inert, so any tap in the tile resolves to the TILE, which is
   * also what stops a bound field taking focus in a mode that will not accept typing), the
   * keyboard (hit-testing never sees it; the input/change dispatch drops anything sourced inside
   * a tile), and the placing sub-mode (the tiles are meant to go quiet, which used to mean only
   * "not selectable" — and therefore "fully live again" for the length of a move).
   */
  const condTile = () => d.querySelector('#panel-combat [data-object="conditions"]');
  const details = () => condTile().querySelector('details');
  const conditionsOf = () => JSON.parse(localStorage.getItem(STORAGE_KEY)).characters[0].conditions;
  const chip = () => [...d.querySelectorAll('#conditions input[data-toggle="conditions"]')][0];

  const openBefore = details().open;
  condTile().querySelector('summary').click();
  await wait(300);
  ok('tapping the Conditions tile does not open its disclosure', details().open === openBefore,
    `open ${openBefore} -> ${details().open}`);
  ok('it selects the tile instead', condTile().classList.contains('is-selected'));

  details().open = true;   // the chips are only tappable once it is open; force it, then tap one
  await wait(200);
  const condBefore = JSON.stringify(conditionsOf());
  chip().click();
  await wait(700);         // longer than the 400ms storage debounce
  ok('tapping a condition chip while arranging does not toggle it',
    JSON.stringify(conditionsOf()) === condBefore,
    `${condBefore} -> ${JSON.stringify(conditionsOf())}`);

  // Keyboard: Space on a focused chip flips `checked` and fires `change` with no pointer event
  // anywhere, so the CSS half of the fix cannot see it. This is the dispatch guard alone.
  chip().checked = true;
  chip().dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
  await wait(700);
  ok('a keyboard-fired change from inside a tile is ignored too',
    JSON.stringify(conditionsOf()) === condBefore, JSON.stringify(conditionsOf()));
  chip().checked = false;
  details().open = openBefore;

  // elementFromPoint, not .focus() — a scripted focus() is not hit-testing, so pointer-events has
  // no say in it and an assertion about it measures nothing (CLAUDE.md's standing warning).
  const hpField = d.getElementById('f-hp-current');
  const fr = hpField.getBoundingClientRect();
  const hitEl = d.elementFromPoint(fr.left + fr.width / 2, fr.top + fr.height / 2);
  ok('a tap over a bound field resolves to its tile, not the field',
    hitEl === hpField.closest('[data-object]'),
    `hit <${hitEl && hitEl.tagName.toLowerCase()}${hitEl && hitEl.id ? `#${hitEl.id}` : ''}>`);

  // ...and the suppression has to survive the placing sub-mode, where nothing is selectable.
  restTile.click();
  await wait(250);
  bar().querySelector('[data-action="place-object-start"]').click();
  await wait(350);
  restBtn.click();
  await wait(300);
  ok('a [data-action] inside a tile stays suppressed while placing', confirms === 0,
    `${confirms} confirm(s)`);
  d.querySelector('[data-action="place-object-cancel"]').click();
  await wait(300);

  // The same tap must still work normally once arranging is over, or the fix has just broken the
  // feature it was protecting.
  d.querySelector('.arrange-bar [data-action="arrange-toggle"]').click();
  await wait(300);
  d.querySelector('#panel-combat [data-object="rest"] [data-action="long-rest"]').click();
  await wait(300);
  ok('and Long rest still works outside arrange mode', confirms === 1, `${confirms} confirm(s)`);
  ok('the rest actually restored the lost hit points',
    d.getElementById('f-hp-current').value === '32',
    `${hpBefore} -> ${d.getElementById('f-hp-current').value}`);

  const failed = results.filter((r) => r.startsWith('FAIL')).length;
  out.textContent = `${failed === 0 ? 'ALL PASS' : `${failed} FAILURE(S)`} — ${results.length} checks\n\n${results.join('\n')}`;
} catch (err) {
  out.textContent = `ERROR ${err && err.stack || err}\n\n${results.join('\n')}`;
}
</script>
